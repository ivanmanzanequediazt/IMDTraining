<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IMDTraining</title>
<meta name="theme-color" content="#0E150F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: una columna tipo instrumento de campo; la FC en grande manda, todo lo demás se lee de un vistazo */
:root{
  /* Identidad IMDTraining: morado de marca, blanco hueso y fondo verde muy oscuro (complementario del morado). Tema oscuro fijo */
  --bg:#0E150F; --surface:#162019; --ink:#EDE6D6; --muted:#A3AE9F; --line:#2B392E; --soft:#1F2B22;
  --accent:#A866DB; --accent-ink:#170B20; --bone:#EDE6D6; --warn:#F0955A; --ok:#7BCB86;
  --z0:#56635A; --z1:#93A6BE; --z2:#4F9BE0; --z3:#5CC46D; --z4:#F59A3A; --z5:#EF5058;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);margin:0;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h2{font-size:24px}
h3{font-size:19px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:13px}
.muted{color:var(--muted)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding-inline:12px;padding-block:8px;display:flex;align-items:center;gap:8px;min-height:52px}
.bar h1{font-size:22px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:none;color:var(--ink);font:600 26px/1 var(--display);width:36px;height:36px;border-radius:8px;cursor:pointer}
.back:focus-visible,.btn:focus-visible,.rpe-row:focus-visible,.item:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--z0)}
.chip.on .dot{background:var(--ok)} .chip.conn .dot,.chip.re .dot{background:var(--warn);animation:blink 1s infinite} .chip.sim .dot{background:var(--accent)}
@keyframes blink{50%{opacity:.25}}

.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 48px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.note{border-left:3px solid var(--warn);background:var(--surface);padding:12px 14px;border-radius:4px 10px 10px 4px;display:flex;flex-direction:column;gap:8px}
.note.info{border-left-color:var(--z2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px var(--body);padding:11px 16px;border-radius:10px;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--z5);border-color:color-mix(in srgb,var(--z5) 45%,var(--line))}
.btn.armed{background:var(--z5);color:#fff;border-color:var(--z5)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent);font:600 15px var(--body);padding:4px 0;cursor:pointer;text-align:left}

.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;color:var(--ink);font:inherit}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:14px;color:var(--muted)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font:700 20px var(--display);color:var(--accent);flex:none}
.tag{font:600 12px var(--body);padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.pend{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.ex{background:color-mix(in srgb,var(--z2) 16%,transparent);color:var(--z2)}

form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-weight:600;font-size:15px}
.hint{font-size:13px;color:var(--muted)}
input,select,textarea{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.g5 input{padding:9px 4px;text-align:center}
.g5 .zl{font:700 13px var(--display);text-align:center;border-radius:6px;padding:2px 0;color:#fff}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink);font:600 14px var(--body);padding:10px 4px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

.ztable{width:100%;border-collapse:collapse;font-size:15px}
.ztable td{padding:6px 4px;border-bottom:1px solid var(--line)}
.ztable tr:last-child td{border-bottom:0}
.zsw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:8px}

.rpe{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rpe-row{display:flex;align-items:center;gap:14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;min-height:42px;cursor:pointer;text-align:left;font:inherit}
.rpe-row:last-child{border-bottom:0}
.rpe-n{font:700 24px var(--display);width:28px;text-align:right;font-variant-numeric:tabular-nums}
.rpe-d{font-size:15px}
.rpe-row.on{background:var(--accent);color:var(--accent-ink)}

.live-hr{display:flex;flex-direction:column;align-items:center;gap:2px;padding-block:6px}
.big{font:700 clamp(96px,34vw,150px)/.85 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em;transition:color .3s}
.unit{font:600 16px var(--display);letter-spacing:.12em;color:var(--muted)}
.zpill{font:700 16px var(--display);letter-spacing:.06em;padding:4px 14px;border-radius:999px;color:#fff;background:var(--z0);text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font:700 28px/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
canvas{display:block;width:100%;height:190px}
canvas.tall{height:240px}
.zb{display:flex;flex-direction:column;gap:7px}
.zb-r{display:grid;grid-template-columns:34px 1fr 58px 44px;align-items:center;gap:8px;font-size:14px}
.zb-r .k{font:700 15px var(--display)}
.zb-t{height:14px;background:var(--soft);border-radius:4px;overflow:hidden}
.zb-f{height:100%;border-radius:4px;transition:width .4s}
.zb-r .v,.zb-r .p{text-align:right;font-variant-numeric:tabular-nums}
.zb-r .p{color:var(--muted)}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
/* Lectura sobre la gráfica */
.chart{position:relative}
canvas.scrub{touch-action:pan-y;cursor:crosshair;border-radius:6px}
.sc-line{position:absolute;top:6px;width:0;border-left:1px dashed var(--ink);opacity:.55;pointer-events:none}
.sc-dot{position:absolute;width:13px;height:13px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--ink);transform:translate(-50%,-50%);pointer-events:none}
.sc-tip{position:absolute;display:flex;flex-direction:column;gap:1px;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.14);padding:5px 10px;border-radius:8px;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
.sc-tip b{font:700 18px/1.1 var(--display)}
.sc-tip span{font-size:12px;color:var(--muted)}
.sc-tip b span{font:inherit}
/* Carga de entrenamiento */
.acwr-pill{align-self:flex-start;font:700 13px var(--body);padding:3px 10px;border-radius:999px;color:#fff}
.acwr-key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.acwr-key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.seg.two{grid-template-columns:1fr 1fr}
/* Fuerza */
.tag.str{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.item .t .tag{vertical-align:2px;margin-left:4px}
.ex{gap:10px}
.ex-h{display:flex;align-items:center;gap:8px}
.ex-n{font:700 22px var(--display);color:var(--accent);min-width:20px;text-align:center}
.ex-name{font-weight:600}
.icon-btn{border:0;background:none;color:var(--muted);font:600 22px/1 var(--body);width:36px;height:36px;border-radius:8px;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--soft)}
.icon-btn.armed{color:#fff;background:var(--z5);font-size:15px}
.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sets{display:flex;flex-direction:column;gap:6px}
.set-h,.set{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 36px;gap:6px;align-items:center}
.set-h span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:center}
.set input,.set select{padding:9px 4px;text-align:center;text-align-last:center;font-variant-numeric:tabular-nums}
.set-n{font:700 17px var(--display);text-align:center;color:var(--muted)}
.ex-f{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipset{font:500 13px var(--mono);background:var(--soft);padding:3px 8px;border-radius:6px}
.ex-var{display:flex;gap:8px;align-items:center}
.ex-var input:not([type]){font-size:15px;padding:8px 12px;flex:1;min-width:0}
.uni{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;padding:6px 4px}
.uni input{width:18px;height:18px;accent-color:var(--accent)}
.set-n small{font:600 11px var(--body);margin-left:2px;color:var(--accent)}
.set.side-D{margin-top:-2px}
.set.side-I{margin-top:4px}
.uni-t td{padding:4px}
details.card>summary{cursor:pointer;font-weight:600;list-style-position:inside}
.st-bar{grid-template-columns:0 1fr 70px 22px}
.mg{display:flex;flex-wrap:wrap;gap:6px}
.mg-c{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 13px var(--body);padding:6px 10px;border-radius:999px;cursor:pointer;min-height:32px}
.mg-c.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mg-c.s{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent)}
.mg-c:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mg-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mg-nav b{font:600 17px var(--display)}
.icon-btn:disabled{opacity:.3;cursor:default}
.mg-list{display:flex;flex-direction:column;gap:10px}
.mgr{display:flex;flex-direction:column;gap:4px}
.mgr-h{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.mgr-h .muted{font-size:13px}
.mgr-t{display:flex;height:12px;background:var(--soft);border-radius:4px;overflow:hidden}
.mgr-d{background:var(--accent)}
.mgr-i{background:var(--accent);opacity:.4}
.welcome{display:flex;flex-direction:column;gap:12px;padding-block:24px}
.big-brand{font:700 italic 46px/1 var(--display);letter-spacing:.01em}
.brand{display:inline-flex;align-items:center;gap:8px}
.brand .logo{width:1.15em;height:1.15em;flex:none}
.bar h1.brand,.d-brand{font-style:italic}
.welcome-logo{width:96px;height:96px;border-radius:24px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.welcome-logo img,.welcome-logo svg{width:100%;height:100%;display:block}
.share{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.diag{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--warn)}
/* ---- Organización visual ---- */
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px;vertical-align:-3px}
.btn .ic{width:18px;height:18px}
.ptabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:4;background:var(--bg);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:6px 12px 8px;border-bottom:1px solid var(--line)}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{flex:1 1 0;min-width:44px;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--muted);font:600 11px var(--body);padding:6px 1px;border-radius:10px;cursor:pointer;white-space:nowrap}
@media (max-width:380px){.ptabs button{font-size:10px;letter-spacing:-.01em}}
.ptabs button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.ptabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.info{font-size:14px;color:var(--muted)}
.info summary{display:inline-flex;align-items:center;gap:6px;cursor:pointer;list-style:none;color:var(--muted);font-weight:600;padding:4px 0}
.info summary::-webkit-details-marker{display:none}
.info summary .ic{width:17px;height:17px}
.info[open] summary{color:var(--ink)}
.info>div{padding:6px 0 2px;line-height:1.5}
.starts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.start{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:0;border-radius:14px;padding:16px 14px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font:inherit;min-height:116px}
.start:nth-child(2){background:var(--surface);color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line))}
.start .ic{width:28px;height:28px;margin-bottom:auto}
.start:nth-child(2) .ic{color:var(--accent)}
.start b{font:700 18px/1.1 var(--display)}
.start span{font-size:13px;opacity:.85}
.start:focus-visible,.kpi:focus-visible,.pcard:focus-visible,.action:focus-visible,.fchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;color:var(--ink);font:inherit;min-width:0}
.kpi b{font:700 26px/1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.kpi span{font-size:12px;color:var(--muted);line-height:1.25}
.kpi .dot{position:absolute;top:12px;right:12px;width:10px;height:10px;border-radius:50%}
.kind{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.kind.hr{background:color-mix(in srgb,var(--z5) 16%,transparent);color:var(--z5)}
.kind.st{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.item .grow{display:flex;flex-direction:column;gap:1px}
.item .grow br{display:none}
.item.hl{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.wk-h{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:10px 2px 2px}
.chips-f{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 14px var(--body);padding:7px 13px;border-radius:999px;cursor:pointer}
.fchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.acwr-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.acwr-head>div{display:flex;flex-direction:column;gap:2px}
.big-num{font:700 46px/1 var(--display)}
.warnTxt{color:var(--warn)}
.prof-head{display:flex;align-items:center;gap:12px}
.avatar.lg{width:54px;height:54px;font-size:26px}
.pname{font:700 22px/1.1 var(--display);display:block}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pcard{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;color:var(--ink);font:inherit;text-align:left;min-width:0}
.pcard .grow{display:flex;flex-direction:column;gap:2px;min-width:0}
.pcard .t{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .s{font-size:13px;color:var(--muted)}
.pcard .tags{display:flex;gap:4px;flex-wrap:wrap}
.pcard .tags:empty{display:none}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:2px}
.acwr-mini{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:58px;padding:6px 8px;border-radius:10px;background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.acwr-mini b{font:700 20px/1 var(--display);color:var(--c)}
.acwr-mini span{font-size:10px;color:var(--muted);letter-spacing:.06em;font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.action{display:flex;flex-direction:column;align-items:flex-start;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;color:var(--ink);font:inherit;text-align:left}
.action .ic{color:var(--accent);width:24px;height:24px;margin-bottom:4px}
.action b{font:700 17px var(--display)}
.action span{font-size:13px;color:var(--muted)}
details.more>summary,details.danger-zone>summary{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;list-style:none}
details.more>summary::-webkit-details-marker,details.danger-zone>summary::-webkit-details-marker{display:none}
details.danger-zone>summary{color:var(--z5)}
details.more[open],details.danger-zone[open]{gap:12px}
details.more:not([open]),details.danger-zone:not([open]){gap:0}
.note.slim{flex-direction:row;align-items:flex-start;gap:10px;padding:10px 12px}
.note.slim .ic{color:var(--z2);margin-top:2px}
.rec-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}

<script>

const BRAND_MARK='<svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><circle cx="256" cy="256" r="164" fill="none" stroke="#EDE6D6" stroke-opacity=".14" stroke-width="40"/><circle cx="256" cy="256" r="164" fill="none" stroke="#A866DB" stroke-width="40" stroke-linecap="round" stroke-dasharray="804 1031" transform="rotate(-90 256 256)"/><polyline points="150,268 206,268 232,196 268,332 298,222 318,268 362,268" fill="none" stroke="#EDE6D6" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const pad=n=>String(n).padStart(2,'0');
function fmtDur(ms){ms=Math.max(0,Math.round(ms/1000));const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60;return h?`${h}:${pad(m)}:${pad(s)}`:`${pad(m)}:${pad(s)}`}
const fmtMin=ms=>Math.round(ms/60000)+' min';

const fmtDT=t=>new Date(t).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function ago(t){const m=Math.round((Date.now()-t)/60000);if(m<1)return'hace un momento';if(m<60)return`hace ${m} min`;const h=Math.round(m/60);return h<48?`hace ${h} h`:`hace ${Math.round(h/24)} días`}
function age(b){if(!b)return null;const d=new Date(b),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))a--;return a}

/* ================= Constantes del dominio ================= */
const ZNAME=['Reposo','Muy suave','Suave','Moderada','Intensa','Máxima'];
const DEF_PC=[50,60,70,80,90];
const TYPES=['Carrera','Fútbol','Fuerza','Bicicleta','Intervalos','Recuperación','Partido','Natación','Otro'];
// Escala CR-10 de Foster (sRPE) y versión para fatiga/estado previo
const RPE_POST=['Reposo','Muy, muy fácil','Fácil','Moderado','Algo duro','Duro','','Muy duro','','','Máximo'];
const RPE_PRE=['Nada de fatiga','Muy, muy leve','Leve','Moderada','Algo fuerte','Fuerte','','Muy fuerte','','','Máxima'];

/* ================= Lógica pura (zonas, parser, resumen) ================= */
const tanaka=a=>Math.round(208-0.7*a);
function zoneLimits(p){ // límites inferiores de Z1..Z5 en ppm
  if(p.method==='manual') return p.manual.map(Number);
  if(p.method==='karvonen'&&p.hrRest) return p.percents.map(x=>Math.round(p.hrRest+x/100*(p.hrMax-p.hrRest)));
  return p.percents.map(x=>Math.round(x/100*p.hrMax));
}
function zoneOf(bpm,lim){let z=0;for(let i=0;i<5;i++)if(bpm>=lim[i])z=i+1;return z}
// Heart Rate Measurement 0x2A37 (little-endian)
function parseHR(dv){
  const f=dv.getUint8(0);let i=1,bpm;
  if(f&1){bpm=dv.getUint16(i,true);i+=2}else{bpm=dv.getUint8(i);i+=1}
  const contact=(f&4)?!!(f&2):null;
  if(f&8)i+=2;
  const rr=[];
  if(f&16){while(i+1<dv.byteLength){rr.push(Math.round(dv.getUint16(i,true)*1000/1024));i+=2}}
  return {bpm,contact,rr};
}
// samples: [t_ms, bpm, segmento]. Huecos >5 s = sin señal; cambio de segmento = pausa
function summarize(samples,lim){
  const zoneMs=[0,0,0,0,0,0];let sumB=0,sumT=0,max=0;

  disconnect(){this.manual=true;clearTimeout(this.timer);try{this.dev?.gatt?.connected&&this.dev.gatt.disconnect()}catch(e){}this.bpm=null;this.set('off')},
  onValue(dv){const p=parseHR(dv);this.bpm=p.bpm;this.contact=p.contact;this.last=Date.now();onHR(p)},
  startSim(){
    if(this.dev)this.disconnect();this.stopSim();this.manual=false;
    const p=prof(S.arg)||S.profiles[0];const max=p?.hrMax||190;let hr=Math.round(max*0.45),t=0;
    this.set('sim');
    this.sim=setInterval(()=>{
      t++;const c=Math.floor((t-90)/120),ph=(t-90)%120;
      let tgt=S.view==='recov'?0.42:t<90?0.6:(ph<60?(c%4===3?0.95:0.87):0.67);
      hr+=(tgt*max-hr)*0.09+(Math.random()-0.5)*3;
      const bpm=Math.round(hr);this.bpm=bpm;this.contact=true;this.last=Date.now();
      onHR({bpm,contact:true,rr:[Math.round(60000/bpm)]});
    },1000);
  },
  stopSim(){if(this.sim){clearInterval(this.sim);this.sim=null;this.bpm=null;if(this.status==='sim')this.set('off')}}
};
function updChip(){

  $('#chipt').textContent=t;

/* ================= Grabación de sesión ================= */
function newRec(p,o){return{id:uid(),userId:p.id,startTime:null,endTime:null,activeMs:0,zoneLimits:zoneLimits(p),hrMax:p.hrMax,
  rpePre:o.rpePre,rpePost:null,rpePostTime:null,type:o.type,notes:'',deviceName:BLE.name(),status:'recording',
  samples:[],rr:[],pauses:[],seg:0,running:false,segStart:0,acc:0,inc:{zoneMs:[0,0,0,0,0,0],sumB:0,sumT:0,max:0}}}
const recActive=r=>r.acc+(r.running?Date.now()-r.segStart:0);
function recAdd(p,t){
  const r=S.rec;if(!r||!r.running)return;
  if(p.bpm<25||p.contact===false)return; // sin contacto: se contará como sin señal
  const last=r.samples[r.samples.length-1];
  if(last&&last[2]===r.seg){const dt=t-last[0];if(dt>0&&dt<=5000){const z=zoneOf(last[1],r.zoneLimits);r.inc.zoneMs[z]+=dt;r.inc.sumB+=last[1]*dt;r.inc.sumT+=dt}}
  r.samples.push([t,p.bpm,r.seg]);if(p.bpm>r.inc.max)r.inc.max=p.bpm;
  for(const x of p.rr)r.rr.push([t,x]);
}
function sessMeta(r){const {samples,rr,pauses,seg,running,segStart,acc,inc,...m}=r;return m}
async function saveRec(){
  const r=S.rec;if(!r)return;
  const m=sessMeta(r);m.activeMs=recActive(r);
  await DB.put('sessions',m);await DB.put('tracks',{id:r.id,samples:r.samples,rr:r.rr,pauses:r.pauses});
  upsertSession(m);
}
function upsertSession(m){const i=S.sessions.findIndex(s=>s.id===m.id);if(i<0)S.sessions.push(m);else S.sessions[i]=m}
async function finalize(meta,track){
  const s=summarize(track.samples,meta.zoneLimits);
  meta.avgHr=s.avgHr;meta.maxHr=s.maxHr;meta.zoneMs=s.zoneMs;
  meta.noSignalMs=Math.max(0,meta.activeMs-s.coveredMs);meta.status='done';
  await DB.put('sessions',meta);await DB.put('tracks',track);upsertSession(meta);
}
async function finishRec(){
  const r=S.rec;const now=Date.now();
  if(r.running){r.acc+=now-r.segStart;r.running=false}
  if(r.blocks){ivTick(r,true);keepAlive('iv',false)}
  const lp=r.pauses[r.pauses.length-1];if(lp&&lp[1]==null)lp[1]=now;
  r.endTime=now;r.activeMs=r.acc;
  const meta=sessMeta(r);meta.activeMs=r.acc;
  await finalize(meta,{id:r.id,samples:r.samples,rr:r.rr,pauses:r.pauses});
  if(meta.planId)await markPlanDone(meta.planId,meta.id);
  clearInterval(S.autosave);S.rec=null;keepAwake(false);
  return meta.id;
}
function onHR(p){
  const t=Date.now();updChip();
  if(S.rec)recAdd(p,t);
  if(S.view==='live')updLive();
  if(S.view==='pre'){const e=$('#preHr');if(e)e.textContent=p.bpm}
  if(S.view==='test'){const e=$('#tHr');if(e)e.textContent=p.bpm}
}

let wl=null;
async function keepAwake(on){try{
  if(on&&!wl&&'wakeLock' in navigator){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}
  if(!on&&wl){await wl.release();wl=null}
}catch(e){}}

/* ================= Gráficas (canvas) ================= */
function cv(el){const r=el.getBoundingClientRect(),d=window.devicePixelRatio||1;el.width=Math.round(r.width*d);el.height=Math.round(r.height*d);const c=el.getContext('2d');c.setTransform(d,0,0,d,0,0);return{c,w:r.width,h:r.height}}
function drawHR(el,samples,lim,hrMax,t0,t1,live){
  if(!el)return;const {c,w,h}=cv(el);
  const L=34,R=6,T=6,B=20,pw=w-L-R,ph=h-T-B;
  let mn=Infinity,mx=0;for(const s of samples){if(s[1]<mn)mn=s[1];if(s[1]>mx)mx=s[1]}
  const lo=Math.max(35,Math.min(lim[0]-15,mn===Infinity?lim[0]-15:mn-5)),hi=Math.max(hrMax,mx)+5;
  const X=t=>L+(t-t0)/(t1-t0||1)*pw,Y=b=>T+(1-(b-lo)/(hi-lo))*ph;
  const muted=css('--muted'),line=css('--line'),ink=css('--ink');
  // bandas de zona
  for(let z=0;z<=5;z++){const a=z?lim[z-1]:lo,b=z<5?lim[z]:hi;if(b<=lo||a>=hi)continue;
    c.fillStyle=zc(z);c.globalAlpha=.13;const y1=Y(Math.min(b,hi)),y2=Y(Math.max(a,lo));c.fillRect(L,y1,pw,y2-y1)}
  c.globalAlpha=1;c.font='10px '+css('--mono');c.textBaseline='middle';c.textAlign='right';
  for(const v of lim){if(v<=lo||v>=hi)continue;const y=Math.round(Y(v))+.5;c.strokeStyle=line;c.lineWidth=1;c.beginPath();c.moveTo(L,y);c.lineTo(L+pw,y);c.stroke();c.fillStyle=muted;c.fillText(v,L-5,y)}
  // eje x
  c.textAlign='center';c.textBaseline='top';c.fillStyle=muted;
  if(live){c.fillText('−3 min',L+12,h-B+5);c.fillText('ahora',L+pw-14,h-B+5)}
  else{const span=(t1-t0)/60000;const st=[1,2,5,10,15,20,30,60].find(s=>span/s<=6)||120;
    for(let m=0;m<=span;m+=st){const x=X(t0+m*60000);c.fillText(m+'′',Math.min(Math.max(x,L+8),L+pw-8),h-B+5)}}
  // trazo de FC coloreado por zona
  c.lineWidth=2.2;c.lineJoin='round';c.lineCap='round';
  for(let i=0;i<samples.length-1;i++){const a=samples[i],b=samples[i+1];if(b[2]!==a[2]||b[0]-a[0]>5000||a[0]<t0)continue;
    c.strokeStyle=zc(zoneOf(a[1],lim));c.beginPath();c.moveTo(X(a[0]),Y(a[1]));c.lineTo(X(b[0]),Y(b[1]));c.stroke()}
  if(live&&samples.length){const a=samples[samples.length-1];c.fillStyle=ink;c.beginPath();c.arc(X(a[0]),Y(a[1]),3.5,0,7);c.fill()}
  if(!samples.length){c.fillStyle=muted;c.textAlign='center';c.textBaseline='middle';c.font='14px '+css('--body');c.fillText('Esperando datos de FC…',L+pw/2,T+ph/2)}
  el._g={samples,lim,t0,t1,L,pw,T,ph,X,Y,live,w};
  if(el._sx!=null)scrubAt(el);
}
/* Lectura de la FC en cada momento: deslizar con el dedo o pasar el ratón */
function nearestSample(sm,t){let lo=0,hi=sm.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(sm[m][0]<t)lo=m;else hi=m}
  return Math.abs(sm[lo][0]-t)<=Math.abs(sm[hi][0]-t)?sm[lo]:sm[hi]}
function attachScrub(el){
  if(!el||el._scrubOn)return;el._scrubOn=true;el.classList.add('scrub');
  const wrap=el.parentElement;
  wrap.insertAdjacentHTML('beforeend','<div class="sc-line" hidden></div><div class="sc-dot" hidden></div><div class="sc-tip" role="status" hidden></div>');
  el._ui={line:wrap.querySelector('.sc-line'),dot:wrap.querySelector('.sc-dot'),tip:wrap.querySelector('.sc-tip')};
  const at=e=>{const r=el.getBoundingClientRect();el._sx=e.clientX-r.left;scrubAt(el)};
  el.addEventListener('pointerdown',at);
  el.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)at(e)});
  el.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hideScrub(el)});
  // Teclado: flechas para recorrer la gráfica
  el.tabIndex=0;
  el.addEventListener('keydown',e=>{const g=el._g;if(!g||!['ArrowLeft','ArrowRight','Escape'].includes(e.key))return;e.preventDefault();
    if(e.key==='Escape')return hideScrub(el);
    el._sx=Math.min(g.L+g.pw,Math.max(g.L,(el._sx??g.L+g.pw/2)+(e.key==='ArrowLeft'?-1:1)*g.pw/60));scrubAt(el)});
}
function hideScrub(el){el._sx=null;if(el._ui)for(const k in el._ui)el._ui[k].hidden=true}
function scrubAt(el){
  const g=el._g,u=el._ui;if(!g||!u)return;
  const x=Math.min(g.L+g.pw,Math.max(g.L,el._sx));
  if(!g.samples.length){hideScrub(el);return}
  const t=g.t0+(x-g.L)/g.pw*(g.t1-g.t0),s=nearestSample(g.samples,t);
  const gap=Math.abs(s[0]-t)>5000;
  const sx=gap?x:g.X(s[0]);
  u.line.hidden=false;u.line.style.left=sx+'px';u.line.style.height=g.ph+'px';
  let when;
  if(g.live)when=`hace ${fmtDur(Date.now()-(gap?t:s[0]))}`;
  else{const tt=gap?t:s[0];when=`${fmtDur(tt-g.t0)} · ${new Date(tt).toLocaleTimeString('es-ES')}`}
  if(gap){u.dot.hidden=true;u.tip.innerHTML=`<b>Sin señal</b><span>${when}</span>`}
  else{const z=zoneOf(s[1],g.lim);u.dot.hidden=false;u.dot.style.left=sx+'px';u.dot.style.top=g.Y(s[1])+'px';u.dot.style.background=zc(z);
    u.tip.innerHTML=`<b>${s[1]} ppm · <span style="color:${zc(z)}">Z${z}</span></b><span>${when}</span>`}
  u.tip.hidden=false;
  const tw=u.tip.offsetWidth,th=u.tip.offsetHeight;
  u.tip.style.left=Math.min(g.w-tw,Math.max(0,sx-tw/2))+'px';
  const dy=gap?g.T+g.ph/2:g.Y(s[1]);u.tip.style.top=(dy-th-12>=0?dy-th-12:dy+14)+'px';
}
function weekStart(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
// Fuentes de carga del perfil (aquí se sumará también la fuerza)
const loadItems=uid=>allOf(uid).map(s=>({t:s.startTime,load:loadOfAny(s)}));
const volItems=uid=>stOf(uid).map(s=>({t:s.startTime,load:strengthStats(s).vol}));
function loadBuckets(items,mode){
  const out=[];
  if(mode==='month'){const d=new Date();d.setDate(1);d.setHours(0,0,0,0);
    for(let i=5;i>=0;i--){const a=new Date(d.getFullYear(),d.getMonth()-i,1).getTime(),b=new Date(d.getFullYear(),d.getMonth()-i+1,1).getTime();
      out.push({label:new Date(a).toLocaleDateString('es-ES',{month:'short'}).replace('.',''),v:items.filter(x=>x.t>=a&&x.t<b).reduce((s,x)=>s+(x.load||0),0)})}}
  else{const now=weekStart(Date.now());
    for(let i=7;i>=0;i--){const ws=new Date(now);ws.setDate(ws.getDate()-7*i);const a=ws.getTime(),e=new Date(ws);e.setDate(e.getDate()+7);
      out.push({label:ws.getDate()+'/'+(ws.getMonth()+1),v:items.filter(x=>x.t>=a&&x.t<e.getTime()).reduce((s,x)=>s+(x.load||0),0)})}}
  return out;
}
function drawBars(el,buckets){
  if(!el)return;const {c,w,h}=cv(el);
  const max=Math.max(100,...buckets.map(x=>x.v)),L=6,B=20,T=18,bw=(w-L*2)/buckets.length;
  c.font='11px '+css('--mono');c.textAlign='center';
  buckets.forEach((x,i)=>{const bh=(h-T-B)*x.v/max,xx=L+i*bw+bw*.18,ww=bw*.64;
    c.fillStyle=i===buckets.length-1?css('--accent'):css('--z1');c.globalAlpha=x.v?1:.25;
    c.fillRect(xx,h-B-Math.max(bh,2),ww,Math.max(bh,2));c.globalAlpha=1;
    c.fillStyle=css('--ink');if(x.v)c.fillText(x.v,xx+ww/2,h-B-bh-6);
    c.fillStyle=css('--muted');c.fillText(x.label,xx+ww/2,h-5)});
}
function drawAcwr(el,ser){
  if(!el)return;const {c,w,h}=cv(el);
  const pts=ser.slice(-42),L=30,R=30,T=8,B=20,pw=w-L-R,ph=h-T-B;
  const muted=css('--muted'),ink=css('--ink');
  const vals=pts.map(p=>p.ratio).filter(v=>v!=null);
  // Escala por los días con datos suficientes; el arranque (muy inestable) se recorta arriba
  const good=pts.filter(p=>p.enough&&p.ratio!=null).map(p=>p.ratio);
  const hi=Math.min(3,Math.max(2,Math.ceil((Math.max(0,...good)+0.1)*4)/4));
  const Y=v=>T+(1-v/hi)*ph,X=i=>L+(pts.length>1?i/(pts.length-1):0.5)*pw;
  [[0,0.8,2],[0.8,1.3,3],[1.3,1.5,4],[1.5,hi,5]].forEach(([a,b,z])=>{c.fillStyle=zc(z);c.globalAlpha=.13;c.fillRect(L,Y(b),pw,Y(a)-Y(b))});
  c.globalAlpha=1;c.font='10px '+css('--mono');c.textAlign='right';c.textBaseline='middle';
  for(const v of [0.8,1.3,1.5]){const y=Math.round(Y(v))+.5;c.strokeStyle=css('--line');c.lineWidth=1;c.beginPath();c.moveTo(L,y);c.lineTo(L+pw,y);c.stroke();c.fillStyle=muted;c.fillText(dec(v,1),L-5,y)}
  if(!vals.length){c.textAlign='center';c.font='14px '+css('--body');c.fillText('Sin carga registrada todavía',L+pw/2,T+ph/2);return}
  // fechas
  c.textAlign='center';c.textBaseline='top';
  pts.forEach((p,i)=>{if((pts.length-1-i)%7===0){const d=new Date(p.t);c.fillText(d.getDate()+'/'+(d.getMonth()+1),Math.min(Math.max(X(i),L+12),L+pw-12),h-B+5)}});
  // línea: tramo con menos de 28 días de datos más tenue
  c.save();c.beginPath();c.rect(L,T,pw,ph);c.clip();
  c.lineWidth=2.2;c.lineJoin='round';c.strokeStyle=ink;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];if(a.ratio==null||b.ratio==null)continue;
    c.globalAlpha=b.enough?1:.35;c.setLineDash(b.enough?[]:[4,4]);c.beginPath();c.moveTo(X(i-1),Y(a.ratio));c.lineTo(X(i),Y(b.ratio));c.stroke()}
  c.restore();c.globalAlpha=1;c.setLineDash([]);
  const li=pts.length-1,lv=pts[li].ratio;
  if(lv!=null&&lv<=hi){c.fillStyle=zc(acwrStatus(lv).z);c.beginPath();c.arc(X(li),Y(lv),5,0,7);c.fill();c.strokeStyle=css('--surface');c.lineWidth=2;c.stroke();
    c.fillStyle=ink;c.textAlign='left';c.textBaseline='middle';c.font='700 13px '+css('--display');c.fillText(dec(lv,2),Math.min(X(li)+8,w-26),Y(lv))}
}

function validate(f){
  if(!f.name)return'Escribe un nombre.';
  if(!(f.hrMax>=100&&f.hrMax<=240))return'La FC máxima debe estar entre 100 y 240 ppm.';
  if(f.hrRest&&!(f.hrRest>=25&&f.hrRest<f.hrMax-20))return'Revisa la FC en reposo.';
  if(f.weight&&!(f.weight>=20&&f.weight<=250))return'Revisa el peso.';
  if(f.method==='karvonen'&&!f.hrRest)return'Karvonen necesita la FC en reposo. Escríbela o elige % FCmáx.';
  const arr=f.method==='manual'?f.manual:f.percents;
  if(arr.some(x=>isNaN(x)))return'Completa el inicio de las cinco zonas.';
  for(let i=1;i<5;i++)if(arr[i]<=arr[i-1])return'Cada zona tiene que empezar por encima de la anterior.';
  if(f.method==='manual'&&arr[4]>=f.hrMax)return'Z5 tiene que empezar por debajo de la FC máxima.';
  return null;
}

function ivState(r){const bs=r.blocks,a=recActive(r);let acc=0;
  for(let i=0;i<bs.length;i++){const e=acc+bs[i].min*60000;if(a<e)return {i,left:e-a,elapsed:a-acc};acc=e}
  return {i:bs.length,left:0,elapsed:0}}
function ivTick(r,final){if(!r?.blocks)return;const st=ivState(r),n=r.blocks.length;
  const close=k=>{const b=r.blocks[k];if(!b||r.ivRes[k])return;r.ivRes[k]={zone:b.zone,min:b.min,inMs:Math.max(0,Math.min(b.min*60000,r.inc.zoneMs[b.zone]-r.ivBase))}};
  if(final){if(r.ivi<n)close(r.ivi);return}
  if(st.i!==r.ivi){for(let k=r.ivi;k<Math.min(st.i,n);k++)close(k);r.ivi=st.i;
    if(st.i<n){const b=r.blocks[st.i];r.ivBase=r.inc.zoneMs[b.zone];beep();alertUser(`Bloque ${st.i+1}/${n}: Z${b.zone}`,`${fmtBl(b.min)} en Z${b.zone}${st.i+1<n?' · luego '+fmtBl(r.blocks[st.i+1].min)+' Z'+r.blocks[st.i+1].zone:''}`);toast(`Bloque ${st.i+1}: ${fmtBl(b.min)} en Z${b.zone}`)}
    else{beep();alertUser('Intervalos completados','Puedes seguir o finalizar la sesión');toast('¡Intervalos completados!');keepAlive('iv',false)}}
  else if(st.i<n&&r.running){const s=Math.ceil(st.left/1000);if(s<=3&&s>=1&&r.ivPip!==st.i*10+s){r.ivPip=st.i*10+s;schedBeeps(0,'pip')}}
  if(S.view==='live')ivRender(r,st)}

  if(st.i>=n){box.innerHTML=`<div class="iv-now done"><span class="lbl">Intervalos</span><b>Completados</b><span class="hint">${r.ivRes.map((x,k)=>`${k+1}: ${Math.round(x.inMs/(x.min*600))} %`).join(' · ')} en zona</span></div>${ivBar(bs)}`;return}
  const b=bs[st.i],nx=bs[st.i+1],cur=BLE.bpm&&Date.now()-BLE.last<5000?zoneOf(BLE.bpm,r.zoneLimits):null,inz=Math.max(0,r.inc.zoneMs[b.zone]-r.ivBase);
  const cue=cur==null?'':cur===b.zone?'<span class="cue ok">En zona</span>':cur<b.zone?'<span class="cue up">Sube ↑</span>':'<span class="cue down">Baja ↓</span>';
  const done=ivTotal(bs.slice(0,st.i))*60000+st.elapsed,pct=Math.min(100,done/(ivTotal(bs)*600));
  box.innerHTML=`<div class="iv-now" style="--c:${zc(b.zone)}"><div class="grow"><span class="lbl">Bloque ${st.i+1} de ${n}</span><div class="iv-z"><b>Z${b.zone}</b><span class="hint num">${zoneRange(p,b.zone)}</span>${cue}</div>
    <span class="hint num">En zona ${fmtDur(inz)} de ${fmtDur(st.elapsed)}${nx?` · luego ${fmtBl(nx.min)} Z${nx.zone}`:' · último bloque'}</span></div><b class="iv-left num">${fmtDur(st.left)}</b></div>
    <div class="ivprog">${ivBar(bs)}<i style="left:${pct}%"></i></div>`}

    exercises:ex.length?ex:[{name:'',sets:[{reps:null,kg:null,rpe:null}]}]};
  await saveSt(st);pl.status='inprogress';pl.doneId=st.id;await savePlan(pl);go('strength',st.id);toast('Sesión preparada: anota solo lo que cambie y el RPE de cada serie')}

async function shareFile(data,base,title,text){const txt=JSON.stringify(data);
  try{if(navigator.canShare){for(const [ext,type] of [['json','application/json'],['txt','text/plain']]){const f=new File([txt],`${base}.${ext}`,{type});
      if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title,text});return 'shared'}}}}
  catch(e){if(e.name==='AbortError')return 'cancel'}
  await download(`${base}.json`,txt,'application/json',false);return 'downloaded'}
async function sendPlan(pl){const p=prof(pl.userId);if(!pl.title){toast('Ponle un título al entrenamiento');return}
  if(pl.kind!=='hr'&&!(pl.exercises||[]).some(e=>normTxt(e.name))){toast('Añade al menos un ejercicio');return}
  const data={app:'imdtraining',kind:'plan',version:4,exported:new Date().toISOString(),forProfileId:pl.userId,forName:p?.name||'',plans:[{...pl,status:'pending',doneId:null,doneAt:null}]};
  const r=await shareFile(data,`imdtraining_entreno_${slug(p?.name)}_${slug(pl.title)}`,`Entrenamiento: ${pl.title}`,`${pl.title} (${planDateTxt(pl.date).toLowerCase()}) para ${p?.name||''}. Ábrelo con IMDTraining: mantén pulsado el archivo → Compartir → IMDTraining.`);

function testResultsHTML(t){

    if(r.hr)h+=`<div class="stats">${stat(dec(r.hr.vo2,1),'VO2máx ml/kg/min')}${stat(dec(r.hr.abs,2),'VO2máx L/min')}${stat(Math.round(r.hr.wMax),'W a FCmáx')}</div>
      <span class="hint num">Recta FC–potencia con ${r.used} etapa${r.used>1?'s':''} (r² = ${dec(r.hr.lr.r2,3)}), extrapolada a ${t.hrMax} ppm. VO2 con la ecuación ACSM de cicloergómetro: 1,8 × (W × 6,12) / kg + 7.</span>`;
    else h+=`<p class="hint" style="margin:0">${!(t.weight>0)?'Falta el peso. ':''}${!(t.hrMax>0)?'Falta la FC máxima. ':''}${r.flat?'La FC no sube con la carga: revisa los datos. ':''}Introduce al menos 2 etapas con potencia y FC para estimar el VO2máx.</p>`;
    if(r.rpe)h+=`<div class="stats">${stat(dec(r.rpe.vo2_19,1),'Por RPE a 19')}${stat(dec(r.rpe.vo2_20,1),'Por RPE a 20')}${stat(dec(r.rpe.lr.r2,2),'r² RPE')}</div><span class="hint">Estimación alternativa: recta RPE–potencia extrapolada a RPE 19 y 20 (Borg 6–20) y pasada a VO2 con la misma ecuación.</span>`;
    const w=[];if(r.low)w.push('Menos de 2 etapas con FC ≥ 110 ppm: se han usado todas, la estimación será menos fiable.');
    if(r.over85)w.push(`Alguna etapa supera el 85 % de la FCmáx (${Math.round(t.hrMax*0.85)} ppm).`);
    if(w.length)h+=`<div class="note">${w.map(x=>`<span class="hint">${x}</span>`).join('')}</div>`;
    h+=`<div class="chart"><canvas id="tChart" style="height:210px" role="img" aria-label="FC frente a potencia con la recta extrapolada a la FC máxima"></canvas></div>
      <span class="hint">Orientativo: los métodos submáximos dependen de que la FCmáx usada sea la real y suelen tener errores del 10–20 %.</span>`;
    return h}
  if(t.type==='vt2'){const r=vt2Calc(t),v=r.vt2;let h='';
    if(v)h+=`<span class="acwr-pill" style="background:${v.how==='medido'?zc(2):zc(4)}">${v.how==='medido'?'VT2 medido':'VT2 estimado por deflexión de la FC (Dmax)'}</span>
      <div class="stats">${stat(Math.round(v.w),'W en VT2')}${stat(v.hr?Math.round(v.hr):'—','FC en VT2')}${stat(v.pctHrMax!=null?Math.round(v.pctHrMax)+' %':'—','% FCmáx')}${stat(v.pctWpeak!=null?Math.round(v.pctWpeak)+' %':'—','% W pico')}${stat(v.rpe!=null?dec(v.rpe,0):'—','RPE en VT2')}${stat(r.wPeak??'—','W pico')}</div>`;
    else if(r.n<5)h+=`<p class="hint" style="margin:0">Hacen falta al menos 5 etapas con potencia y FC (llevas ${r.n}).</p>`;
    else h+=`<div class="note"><b>No se detecta deflexión de la FC</b><span class="hint">Pasa en una parte de las personas, sobre todo si el test termina pronto o la FC sube de forma lineal hasta el final. Usa el VT2 medido si lo tienes, o repite el test con más etapas por encima del umbral.</span></div>`;
    if(r.n>=2)h+=`<div class="chart"><canvas id="tChart" style="height:210px" role="img" aria-label="FC frente a potencia con el ajuste cúbico y el punto de deflexión"></canvas></div>`;
    h+=`<span class="hint">El método Dmax busca el punto de la curva FC–potencia (ajuste cúbico) más alejado de la recta entre la primera y la última etapa. Es una estimación de campo; el VT2 con analizador de gases es la referencia.</span>`;
    return h}
  const j=jumpCalc(t),row=k=>{const x=j[k];return `<tr><td><b>${JUMPS[k].n}</b></td><td class="num">${x?dec(x.best,1):'—'}</td><td class="num">${x?dec(x.mean,1):'—'}</td><td class="num">${x?.cv!=null?dec(x.cv,1):'—'}</td><td class="num">${x?.pp!=null?Math.round(x.pp):'—'}</td><td class="num">${x?.ppkg!=null?dec(x.ppkg,1):'—'}</td></tr>`};
  const prev=testsOf(t.userId).filter(x=>x.type==='jump'&&x.id!==t.id&&x.date<t.date)[0],pj=prev?jumpCalc(prev):null;
  return `<div class="tbl"><table class="ztable jt"><thead><tr><th></th><th>Mejor cm</th><th>Media</th><th>CV %</th><th>Pot. W</th><th>W/kg</th></tr></thead><tbody>${row('cmj')}${row('sj')}${row('abk')}</tbody></table></div>
    <div class="stats">${stat(j.elastic!=null?dec(j.elastic,1):'—','Elasticidad %')}${stat(j.arms!=null?dec(j.arms,1):'—','Brazos %')}${stat(pj?.cmj&&j.cmj?(j.cmj.best-pj.cmj.best>=0?'+':'')+dec(j.cmj.best-pj.cmj.best,1):'—','Δ CMJ cm')}</div>
    <span class="hint">Potencia pico con Sayers et al. (1999): 60,7 × altura (cm) + 45,3 × masa (kg) − 2055, para CMJ y SJ${t.weight>0?'':' (falta el peso)'}. Índice de elasticidad = (CMJ − SJ) / SJ. Índice de brazos = (Abalakov − CMJ) / CMJ.${pj?` Δ frente al test del ${fmtDate(prev.date)}.`:''}</span>`;
}
function drawXY(el,o){
  if(!el)return;const {c,w,h}=cv(el);const L=38,R=10,T=10,B=26,pw=w-L-R,ph=h-T-B;
  const X=x=>L+(x-o.x0)/(o.x1-o.x0)*pw,Y=y=>T+(1-(y-o.y0)/(o.y1-o.y0))*ph;
  const muted=css('--muted'),line=css('--line'),ink=css('--ink'),acc=css('--accent');
  c.font='10px '+css('--mono');c.fillStyle=muted;c.strokeStyle=line;c.lineWidth=1;
  const tick=(a,b,n)=>{const st=[5,10,20,25,50,100].find(s=>(b-a)/s<=n)||200;const out=[];for(let v=Math.ceil(a/st)*st;v<=b;v+=st)out.push(v);return out};
  c.textAlign='right';c.textBaseline='middle';for(const v of tick(o.y0,o.y1,5)){const y=Math.round(Y(v))+.5;c.beginPath();c.moveTo(L,y);c.lineTo(L+pw,y);c.stroke();c.fillText(v,L-5,y)}
  c.textAlign='center';c.textBaseline='top';for(const v of tick(o.x0,o.x1,6))c.fillText(v,X(v),h-B+5);
  c.fillText(o.xLabel||'W',L+pw-8,h-12);
  c.save();c.beginPath();c.rect(L,T,pw,ph);c.clip();
  if(o.hline){c.strokeStyle=zc(5);c.setLineDash([5,4]);c.beginPath();c.moveTo(L,Y(o.hline.y));c.lineTo(L+pw,Y(o.hline.y));c.stroke();c.setLineDash([]);
    c.fillStyle=zc(5);c.textAlign='left';c.textBaseline='bottom';c.fillText(o.hline.label,L+4,Y(o.hline.y)-2)}
  for(const ln of o.lines||[]){c.strokeStyle=ln.color||ink;c.lineWidth=ln.width||2;c.setLineDash(ln.dash||[]);c.beginPath();ln.pts.forEach(([x,y],i)=>i?c.lineTo(X(x),Y(y)):c.moveTo(X(x),Y(y)));c.stroke()}
  c.setLineDash([]);
  for(const [x,y] of o.points||[]){c.fillStyle=acc;c.beginPath();c.arc(X(x),Y(y),4.5,0,7);c.fill();c.strokeStyle=css('--surface');c.lineWidth=1.5;c.stroke()}
  c.restore();
  if(o.marker){const {x,y,label}=o.marker;c.fillStyle=zc(4);c.beginPath();c.arc(X(x),Y(y),6,0,7);c.fill();c.strokeStyle=css('--surface');c.lineWidth=2;c.stroke();
    c.font='700 13px '+css('--display');const tw=c.measureText(label).width+10,right=X(x)+tw+12<=L+pw;
    const bx=right?X(x)+10:X(x)-10-tw,by=Math.min(T+ph-20,Y(y)+10);
    c.fillStyle=css('--surface');c.strokeStyle=css('--line');c.lineWidth=1;c.beginPath();c.roundRect?c.roundRect(bx,by,tw,20,5):c.rect(bx,by,tw,20);c.fill();c.stroke();
    c.fillStyle=ink;c.textAlign='left';c.textBaseline='middle';c.fillText(label,bx+5,by+10.5)}
}
function drawTestChart(){
  const t=testById(S.arg),el=$('#tChart');if(!t||!el)return;
  const st=(t.stages||[]).filter(s=>+s.w>0&&+s.hr>0).map(s=>[+s.w,+s.hr]);if(!st.length)return;
  const maxW=Math.max(...st.map(p=>p[0])),minHr=Math.min(...st.map(p=>p[1]));
  if(t.type==='vo2'){const r=vo2Calc(t);const wEnd=r.hr?Math.max(r.hr.wMax,maxW):maxW;
    drawXY(el,{x0:0,x1:Math.ceil(wEnd*1.08/25)*25||100,y0:Math.max(40,Math.floor((minHr-15)/10)*10),y1:Math.max(t.hrMax||0,...st.map(p=>p[1]))+10,points:st,
      lines:r.hr?[{pts:[[Math.min(...st.map(p=>p[0])),r.hr.lr.a+r.hr.lr.b*Math.min(...st.map(p=>p[0]))],[r.hr.wMax,t.hrMax]],color:css('--ink'),dash:[6,4],width:1.6}]:[],
      hline:t.hrMax?{y:t.hrMax,label:'FCmáx '+t.hrMax}:null,marker:r.hr?{x:r.hr.wMax,y:t.hrMax,label:Math.round(r.hr.wMax)+' W'}:null})}
  else{const r=vt2Calc(t),d=r.dmax,lines=[];
    if(d){const curve=[];for(let i=0;i<=60;i++){const w=d.x0+(d.x1-d.x0)*i/60;curve.push([w,polyval(d.co,w/d.S0)])}
      lines.push({pts:curve,color:css('--ink'),width:1.8},{pts:[[d.x0,d.y0],[d.x1,d.y1]],color:css('--muted'),dash:[4,4],width:1.2})}
    const v=r.vt2;
    drawXY(el,{x0:Math.max(0,Math.floor((Math.min(...st.map(p=>p[0]))-25)/25)*25),x1:Math.ceil((maxW+15)/25)*25,y0:Math.max(40,Math.floor((minHr-10)/10)*10),y1:Math.max(t.hrMax||0,...st.map(p=>p[1]))+8,
      points:st,lines,hline:t.hrMax?{y:t.hrMax,label:'FCmáx '+t.hrMax}:null,marker:v&&v.hr?{x:v.w,y:v.hr,label:'VT2 '+Math.round(v.w)+' W'}:null})}
}

function go(view,arg,{push=true,keepForm=false}={}){
  if(S.view==='strength'&&!(view==='strength'&&arg===S.arg))dropDraft(S.arg);
  if(push)S.stack.push([S.view,S.arg]);
  S.view=view;S.arg=arg??null;if(!keepForm)S.form={};render();window.scrollTo(0,0);
  if(push)try{history.pushState({},'')}catch(e){}
}
function back(){
  if(S.view==='live')return; // en directo no se sale con «atrás»
  if(S.view==='strength')dropDraft(S.arg);
  const prev=S.stack.pop();if(!prev){go('home',null,{push:false});return}
  let [v,a]=prev;if(v==='live'||v==='recov'||v==='pre'||v==='post'||v==='stpost'||(v==='edit'&&S.view!=='edit'))return back();
  if((v==='strength'||v==='ssum')&&!stById(a)){v='home';a=null}
  if(v==='test'&&!testById(a)){v='home';a=null}
  if(v==='plan'&&!planById(a)){v='home';a=null}
  if((v==='profile'&&!prof(a))||(v==='summary'&&!S.sessions.find(x=>x.id===a))){v='home';a=null}
  go(v,a,{push:false});
}

    for(const k of keys){const r=await cache.match(k);files.push(new File([await r.blob()],decodeURIComponent(r.headers.get('x-name')||'datos.json')));await cache.delete(k)}

        const m=kind==='plan'||kind==='session'?'client':'coach';lsSet('mode',m);if(!lsGet('mode'))S.modeFallback=m;
        if(m==='client'&&!myProfile()){S.pendingFiles=files;clientRoot();render();toast('Crea tu perfil y se abrirá el entrenamiento que te han enviado');return}
        if(m==='coach'){S.view='home';S.arg=null;render()}}
      if(isClient()&&!myProfile()){S.pendingFiles=files;clientRoot();render();toast('Crea tu perfil y se abrirá el entrenamiento que te han enviado');return}
      await importFiles(files)}
    else toast('No ha llegado ningún archivo. Prueba a compartirlo otra vez')}
  catch(e){toast('No se pudo leer el archivo compartido')}}
// Importación: archivos que envían los clientes o copias de seguridad. Sin filtro de tipo: Android no reconoce bien los .json
async function importFiles(files){
  const res={profiles:[],nNew:0,errors:[],athlete:[],plansDone:0};
  for(const file of files){let d;
    try{let txt=await file.text();txt=txt.replace(/^﻿/,'').trim();
      if(!txt.startsWith('{'))throw new Error('formato');d=JSON.parse(txt)}
    catch(e){res.errors.push(`«${file.name}» no se puede leer como archivo de datos`);continue}
    if(!['imdtraining','imdt-training','pulsometro'].includes(d.app)){res.errors.push(`«${file.name}» no es un archivo de IMDTraining`);continue}
    // Entrenamientos programados y sesiones que envía el entrenador al deportista
    if(d.kind==='plan'||d.kind==='session'){const r=await importForAthlete(d);if(r.error)res.errors.push(r.error);else res.athlete.push(...r.items);continue}
    if(isClient()){res.errors.push(`«${file.name}» son datos para el entrenador: ábrelo en modo entrenador`);continue}
    // Las copias completas traen el perfil de ejemplo del otro móvil: se ignora junto con sus datos
    const exIds=new Set((d.profiles||[]).filter(p=>p.example).map(p=>p.id)),keep=x=>!exIds.has(x.userId)&&!x.example;
    const profiles=(d.profiles||[]).filter(p=>!p.example),sessions=(d.sessions||[]).filter(keep),strength=(d.strength||[]).filter(keep),tests=(d.tests||[]).filter(keep);
    const sesIds=new Set(sessions.map(x=>x.id)),tracks=(d.tracks||[]).filter(t=>sesIds.has(t.id));
    const had=new Set([...S.sessions,...S.strength,...S.tests].map(x=>x.id)),hadP=new Set(S.profiles.map(x=>x.id));
    const fromOther=d.kind==='client'||profiles.some(p=>p.owner==='client');
    // Si el deportista abrió algo que le enviaste desde un perfil creado por ti, sus datos se guardan en ese mismo perfil
    const idMap={};
    for(const p of profiles){let q={...p};
      if(fromOther){q.remote=true;q.lastImport=Date.now();delete q.owner;
        if(p.linkId&&p.linkId!==p.id&&prof(p.linkId)){idMap[p.id]=p.linkId;q={...q,id:p.linkId,name:prof(p.linkId).name}}}
      await DB.put('profiles',q);res.profiles.push({name:q.name,id:q.id,isNew:!hadP.has(q.id)})}
    const rm=x=>idMap[x.userId]?{...x,userId:idMap[x.userId]}:x;
    for(const x of sessions)await DB.put('sessions',rm(x));for(const x of tracks)await DB.put('tracks',x);
    for(const x of strength)await DB.put('strength',rm(x));for(const x of tests)await DB.put('tests',rm(x));
    for(const x of d.plans||[])if(!planById(x.id))await DB.put('plans',rm(x));
    for(const x of d.wellness||[])await DB.put('wellness',rm(x));
    // Entrenamientos programados que el deportista ya ha hecho
    for(const x of [...sessions,...strength])if(x.planId&&x.status==='done'){const pl=planById(x.planId)||await DB.get('plans',x.planId);if(pl&&pl.status!=='done'){await markPlanDone(x.planId,x.id,x.endTime||x.startTime);res.plansDone++}}
    res.nNew+=[...sessions,...strength,...tests].filter(x=>!had.has(x.id)).length}
  await loadAll();
  const errs=res.errors.length?'. '+res.errors.join('. '):'';
  if(res.athlete.length&&!res.profiles.length){const a=res.athlete;
    if(a.length===1){const x=a[0];if(x.type==='plan')toRoot('plan',x.id);else if(x.type==='st')toRoot('ssum',x.id);else if(x.type==='hr')toRoot('summary',x.id);else toRoot('test',x.id);

    else{const me=myProfile()||prof(a[0].uid);if(me){S.ptab='res';toRoot('profile',me.id)}toast((a.every(x=>x.type==='plan')?`${a.length} entrenamientos nuevos: `:`Recibidos ${a.length} elementos: `)+a.map(x=>x.name).join(', ')+errs)}
    return}
  const pd=res.plansDone?` · ${res.plansDone} entrenamiento${res.plansDone===1?'':'s'} programado${res.plansDone===1?'':'s'} hecho${res.plansDone===1?'':'s'}`:'';
  if(res.profiles.length===1){const p=res.profiles[0];toRoot('profile',p.id);toast(`${p.isNew?'Añadido':'Actualizado'} el perfil de ${p.name}: ${res.nNew} registro${res.nNew===1?'':'s'} nuevo${res.nNew===1?'':'s'}${pd}${res.errors.length?'. '+res.errors.join('. '):''}`)}
  else if(res.profiles.length){toRoot('home');toast(`Importados ${res.profiles.length} perfiles (${res.profiles.map(p=>p.name).join(', ')}) · ${res.nNew} registros nuevos${res.errors.length?'. '+res.errors.join('. '):''}`)}
  else toast(res.errors.join('. ')||'El archivo no contiene perfiles')}

async function download(name,text,type,bom=true){
  const blob=new Blob([bom?'﻿'+text:text],{type:type+';charset=utf-8'});
  const file=new File([blob],name,{type});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})&&/Android|iPhone|iPad/i.test(navigator.userAgent)){await navigator.share({files:[file],title:name});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  if(inFrame)toast('La descarga no funciona en esta vista. Ábrela desde su enlace.');
}

/* ================= Datos de ejemplo ================= */
function genSession(p,start,mins,kind){
  const lim=zoneLimits(p),samples=[],max=p.hrMax;let hr=p.hrRest?p.hrRest+15:80,t=start;
  for(let s=0;s<mins*60;s++){
    let tgt;const m=s/60;
    if(kind==='int'){tgt=m<10?0.65:m>mins-8?0.6:(Math.floor((m-10)/2)%2===0?0.9:0.7)}
    else if(kind==='rec'){tgt=0.6}
    else{tgt=m<8?0.65:m>mins-5?0.62:0.76+0.04*Math.sin(m/4)}
    hr+=(tgt*max-hr)*0.06+(Math.random()-0.5)*2.6;
    samples.push([t,Math.round(hr),0]);t+=1000+(Math.random()<0.02?0:0);
  }
  return {samples,lim};
}

  for(let w=5;w>=0;w--){(w===0?[1,2,4,6]:[1,3,5]).forEach((dd,k)=>{const [type,kind]=types[k%4];
    const mins=kind==='rec'?30:38+((w*7+k)%3)*6,post=kind==='int'?(w===0?9:7):kind==='rec'?3:(w===0?7:5);
    plan.push([w*7+dd,type,mins,kind,3+(k%3),post,k%2])})}
  for(const [dAgo,type,mins,kind,pre,post,h] of plan){

    await finalize(m,{id:m.id,samples,rr:[],pauses:[]});
  }
  // Fuerza: una sesión por semana con progresión de cargas
  const R=()=>Math.random();
  for(let w=5;w>=0;w--){const st=new Date();st.setDate(st.getDate()-(w*7+(w===0?3:2)));st.setHours(17,30,0,0);const pr=5-w;
    const sets=(n,reps,kg,rpe0)=>Array.from({length:n},(_,i)=>({reps,kg,rpe:Math.min(10,rpe0+(i>=n-1?1:0)+(w===0?1:0))}));
    const ex=[{name:'Sentadilla',sets:sets(4,6,70+2.5*pr,6)},{name:'Press banca',sets:sets(4,8,50+2.5*Math.floor(pr/2),6)},
      {name:'Peso muerto rumano',sets:sets(3,10,60+2.5*pr,5)},{name:'Dominadas',sets:sets(3,7+Math.floor(pr/3),0,7)}];
    await DB.put('strength',{id:uid(),userId:p.id,kind:'strength',type:w%2?'Tren inferior':'Full body',startTime:st.getTime(),endTime:st.getTime()+55*60000,durationMin:52+Math.round(R()*8),
      rpePre:3,rpePost:w===0?8:7,rpePostTime:st.getTime()+85*60000,notes:'',status:'done',exercises:ex,example:true})}
  // Test de ejemplo
  const ago=(d,h=10)=>{const x=new Date();x.setDate(x.getDate()-d);x.setHours(h,0,0,0);return x.getTime()};
  const T=(type,d,extra)=>DB.put('tests',{id:uid(),userId:p.id,type,date:ago(d),weight:72,hrMax:p.hrMax,protocol:'ymca',stages:[],measured:{w:'',hr:''},gen:{start:50,inc:25,n:12},jumps:{cmj:[],sj:[],abk:[]},notes:'',example:true,...extra});
  await T('vo2',38,{weight:73,stages:[{w:25,hr:96,rpe:8},{w:75,hr:124,rpe:11},{w:100,hr:137,rpe:13},{w:125,hr:150,rpe:14}]});
  await T('vo2',4,{stages:[{w:25,hr:92,rpe:7},{w:75,hr:118,rpe:10},{w:100,hr:130,rpe:12},{w:125,hr:143,rpe:13}]});
  await T('vt2',11,{stages:Array.from({length:12},(_,i)=>{const w=50+25*i;return {w,hr:Math.round(w<=250?92+0.29*w:164.5+0.09*(w-250)+(i%2?1:0)),rpe:Math.min(20,7+i)}})});
  await T('jump',33,{weight:73,jumps:{cmj:[36.1,37.4,36.8],sj:[32.5,33,32.1],abk:[42,43.1,42.6]}});
  await T('jump',3,{jumps:{cmj:[38.2,37.6,38.9],sj:[33.8,34.4,33.9],abk:[44.5,45.2,44]}});
  { const t=new Date();t.setDate(t.getDate()+1);const ds=`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
    await DB.put('plans',{id:uid(),userId:p.id,title:'Fuerza · semana 7',kind:'strength',date:ds,status:'pending',createdAt:Date.now(),example:true,notes:'Calentamiento de 10 min. Descansos de 2–3 min en los básicos.',hr:{type:'Carrera',minutes:40,zone:2},
      exercises:[{name:'Sentadilla',variant:'',unilateral:false,sets:[{reps:5,kg:85,rpe:7},{reps:5,kg:85,rpe:7},{reps:5,kg:85,rpe:8},{reps:5,kg:85,rpe:8}]},
        {name:'Press banca',variant:'',unilateral:false,sets:[{reps:6,kg:57.5,rpe:7},{reps:6,kg:57.5,rpe:7},{reps:6,kg:57.5,rpe:8}]},
        {name:'Sentadilla búlgara',variant:'',unilateral:true,sets:[{reps:8,kg:16,rpe:7},{reps:8,kg:16,rpe:7}]}]});
    await DB.put('plans',{id:uid(),userId:p.id,title:'Rodaje suave',kind:'hr',date:ds,status:'pending',createdAt:Date.now(),example:true,notes:'Ritmo conversacional.',hr:{type:'Carrera',minutes:40,zone:2},exercises:[]}); }
  // Bienestar de los últimos 21 días (con un bajón en los últimos días de más carga)
  for(let i=21;i>=1;i--){const d=new Date();d.setDate(d.getDate()-i);const ds=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,low=i<=3,r=()=>Math.random();
    const v=b=>Math.max(1,Math.min(5,Math.round(b+(r()-.5)*1.2)));
    await DB.put('wellness',{id:p.id+'_'+ds,userId:p.id,date:ds,at:d.getTime(),example:true,sleep:v(low?3:4),fatigue:v(low?2.4:3.8),soreness:v(low?2.4:3.6),stress:v(3.6),mood:v(low?3:4),restHr:Math.round((low?63:57)+(r()-.5)*4)})}
  lsSet('seeded','1');
}

async function loadAll(){S.profiles=await DB.all('profiles');S.sessions=await DB.all('sessions');S.strength=await DB.all('strength');S.tests=await DB.all('tests');S.plans=await DB.all('plans');S.wellness=await DB.all('wellness')}
(async()=>{
  await DB.open();await loadAll();
  for(const st of S.strength.filter(x=>x.status==='open'&&stEmpty(x)))dropDraft(st.id);
  // Modo: enlace de invitación (#cliente), elección guardada o deducido de los datos que ya hay
  let m=lsGet('mode');
  if(!m){const own=S.profiles.filter(p=>!p.example&&!p.remote);
    if(location.hash==='#cliente')m='client';
    else if(own.length===1&&own[0].owner==='client'&&S.profiles.length===1)m='client';
    else if(S.profiles.length||lsGet('seeded'))m='coach';
    if(m){lsSet('mode',m);if(!lsGet('mode'))S.modeFallback=m}}
  if(location.hash==='#cliente')try{history.replaceState({},'',location.pathname+location.search)}catch(e){}
  // Datos de ejemplo (solo modo entrenador): se crean la primera vez y se renuevan si cambia su versión
  const ex=S.profiles.find(p=>p.example);
  if(m==='coach'&&((!S.profiles.length&&!lsGet('seeded'))||(ex&&lsGet('seedv')!=='6'))){
    if(ex){for(const s of S.sessions.filter(s=>s.userId===ex.id)){await DB.del('sessions',s.id);await DB.del('tracks',s.id)}
      for(const s of S.strength.filter(s=>s.userId===ex.id))await DB.del('strength',s.id);for(const t of S.tests.filter(t=>t.userId===ex.id))await DB.del('tests',t.id);for(const x of S.plans.filter(x=>x.userId===ex.id))await DB.del('plans',x.id);for(const x of S.wellness.filter(x=>x.userId===ex.id))await DB.del('wellness',x.id);await DB.del('profiles',ex.id)}
    await seedExample();lsSet('seedv','6');await loadAll()}
  try{history.replaceState({},'')}catch(e){}
  // Archivos compartidos a la app desde WhatsApp u otra app (llegan por el service worker)
  const sharedN=new URLSearchParams(location.search).get('shared');
  if(m==='coach')lsSet('coachDev','1');
  if(!m)S.view='welcome';else if(m==='client')clientRoot();
  syncDrawerMode();render();updChip();
  if(sharedN!=null){try{history.replaceState({},'',location.pathname)}catch(e){}await importShared()}
  // Instalación como app (solo desde su propio enlace https)
  if('serviceWorker' in navigator&&!inFrame&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
