<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IMDTraining</title>
<meta name="theme-color" content="#0E150F">
<script>try{var t=localStorage.getItem('theme')||'dark';if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;if(t==='light')document.querySelector('meta[name=theme-color]').content='#F4F1EA'}catch(e){}</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: una columna tipo instrumento de campo; la FC en grande manda, todo lo demás se lee de un vistazo */
:root{
  /* Identidad IMDTraining: morado de marca, blanco hueso y fondo verde muy oscuro (complementario del morado). Tema oscuro fijo */
  --bg:#0E150F; --surface:#162019; --ink:#EDE6D6; --muted:#A3AE9F; --line:#2B392E; --soft:#1F2B22;
  --accent:#A866DB; --accent-ink:#170B20; --bone:#EDE6D6; --warn:#F0955A; --ok:#7BCB86;
  --z0:#56635A; --z1:#93A6BE; --z2:#4F9BE0; --z3:#5CC46D; --z4:#F59A3A; --z5:#EF5058;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --scrim:rgba(4,8,5,.7);
  color-scheme:dark;
}
/* Tema claro: fondo hueso cálido, tarjetas blancas y morado más oscuro para que contraste */
:root[data-theme="light"]{
  --bg:#F4F1EA; --surface:#FFFFFF; --ink:#1B221C; --muted:#5D6A5E; --line:#DDD7CA; --soft:#ECE7DC;
  --accent:#8743BE; --accent-ink:#FFFFFF; --bone:#1B221C; --warn:#C2621C; --ok:#2E8A3F;
  --z0:#8E9A91; --z1:#7189A8; --z2:#2F7FCB; --z3:#3A9E4D; --z4:#E07F1A; --z5:#D63B44;
  --scrim:rgba(27,34,28,.45);
  color-scheme:light;
}
.logo{color:var(--ink)}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);margin:0;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h2{font-size:24px}
h3{font-size:19px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:13px}
.muted{color:var(--muted)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding-inline:12px;padding-block:8px;display:flex;align-items:center;gap:8px;min-height:52px}
.bar h1{font-size:22px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:none;color:var(--ink);font:600 26px/1 var(--display);width:36px;height:36px;border-radius:8px;cursor:pointer}
.back:focus-visible,.btn:focus-visible,.rpe-row:focus-visible,.item:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--z0)}
.chip.on .dot{background:var(--ok)} .chip.conn .dot,.chip.re .dot{background:var(--warn);animation:blink 1s infinite} .chip.sim .dot{background:var(--accent)}
@keyframes blink{50%{opacity:.25}}

.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 48px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.note{border-left:3px solid var(--warn);background:var(--surface);padding:12px 14px;border-radius:4px 10px 10px 4px;display:flex;flex-direction:column;gap:8px}
.note.info{border-left-color:var(--z2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px var(--body);padding:11px 16px;border-radius:10px;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--z5);border-color:color-mix(in srgb,var(--z5) 45%,var(--line))}
.btn.armed{background:var(--z5);color:#fff;border-color:var(--z5)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent);font:600 15px var(--body);padding:4px 0;cursor:pointer;text-align:left}

.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;color:var(--ink);font:inherit}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:14px;color:var(--muted)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font:700 20px var(--display);color:var(--accent);flex:none}
.tag{font:600 12px var(--body);padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.pend{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.ex{background:color-mix(in srgb,var(--z2) 16%,transparent);color:var(--z2)}

form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-weight:600;font-size:15px}
.hint{font-size:13px;color:var(--muted)}
input,select,textarea{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.g5 input{padding:9px 4px;text-align:center}
.g5 .zl{font:700 13px var(--display);text-align:center;border-radius:6px;padding:2px 0;color:#fff}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink);font:600 14px var(--body);padding:10px 4px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

.ztable{width:100%;border-collapse:collapse;font-size:15px}
.ztable td{padding:6px 4px;border-bottom:1px solid var(--line)}
.ztable tr:last-child td{border-bottom:0}
.zsw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:8px}

.rpe{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rpe-row{display:flex;align-items:center;gap:14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;min-height:42px;cursor:pointer;text-align:left;font:inherit}
.rpe-row:last-child{border-bottom:0}
.rpe-n{font:700 24px var(--display);width:28px;text-align:right;font-variant-numeric:tabular-nums}
.rpe-d{font-size:15px}
.rpe-row.on{background:var(--accent);color:var(--accent-ink)}

.live-hr{display:flex;flex-direction:column;align-items:center;gap:2px;padding-block:6px}
.big{font:700 clamp(96px,34vw,150px)/.85 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em;transition:color .3s}
.unit{font:600 16px var(--display);letter-spacing:.12em;color:var(--muted)}
.zpill{font:700 16px var(--display);letter-spacing:.06em;padding:4px 14px;border-radius:999px;color:#fff;background:var(--z0);text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font:700 28px/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
canvas{display:block;width:100%;height:190px}
canvas.tall{height:240px}
.zb{display:flex;flex-direction:column;gap:7px}
.zb-r{display:grid;grid-template-columns:34px 1fr 58px 44px;align-items:center;gap:8px;font-size:14px}
.zb-r .k{font:700 15px var(--display)}
.zb-t{height:14px;background:var(--soft);border-radius:4px;overflow:hidden}
.zb-f{height:100%;border-radius:4px;transition:width .4s}
.zb-r .v,.zb-r .p{text-align:right;font-variant-numeric:tabular-nums}
.zb-r .p{color:var(--muted)}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
/* Lectura sobre la gráfica */
.chart{position:relative}
canvas.scrub{touch-action:pan-y;cursor:crosshair;border-radius:6px}
.sc-line{position:absolute;top:6px;width:0;border-left:1px dashed var(--ink);opacity:.55;pointer-events:none}
.sc-dot{position:absolute;width:13px;height:13px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--ink);transform:translate(-50%,-50%);pointer-events:none}
.sc-tip{position:absolute;display:flex;flex-direction:column;gap:1px;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.14);padding:5px 10px;border-radius:8px;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
.sc-tip b{font:700 18px/1.1 var(--display)}
.sc-tip span{font-size:12px;color:var(--muted)}
.sc-tip b span{font:inherit}
/* Carga de entrenamiento */
.acwr-pill{align-self:flex-start;font:700 13px var(--body);padding:3px 10px;border-radius:999px;color:#fff}
.acwr-key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.acwr-key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.seg.two{grid-template-columns:1fr 1fr}
/* Fuerza */
.tag.str{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.item .t .tag{vertical-align:2px;margin-left:4px}
.ex{gap:10px}
.ex-h{display:flex;align-items:center;gap:8px}
.ex-n{font:700 22px var(--display);color:var(--accent);min-width:20px;text-align:center}
.ex-name{font-weight:600}
.icon-btn{border:0;background:none;color:var(--muted);font:600 22px/1 var(--body);width:36px;height:36px;border-radius:8px;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--soft)}
.icon-btn.armed{color:#fff;background:var(--z5);font-size:15px}
.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sets{display:flex;flex-direction:column;gap:6px}
.set-h,.set{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 36px;gap:6px;align-items:center}
.set-h span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:center}
.set input,.set select{padding:9px 4px;text-align:center;text-align-last:center;font-variant-numeric:tabular-nums}
.set-n{font:700 17px var(--display);text-align:center;color:var(--muted)}
.ex-f{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipset{font:500 13px var(--mono);background:var(--soft);padding:3px 8px;border-radius:6px}
.ex-var{display:flex;gap:4px 8px;align-items:center;flex-wrap:wrap}.ex-var>input{flex:1 1 160px;min-width:0}
.ex-var input:not([type]){font-size:15px;padding:8px 12px;flex:1;min-width:0}
.uni{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;padding:6px 4px}
.uni input{width:18px;height:18px;accent-color:var(--accent)}
.set-n small{font:600 11px var(--body);margin-left:2px;color:var(--accent)}
.set.side-D{margin-top:-2px}
.set.side-I{margin-top:4px}
.uni-t td{padding:4px}
details.card>summary{cursor:pointer;font-weight:600;list-style-position:inside}
.st-bar{grid-template-columns:0 1fr 70px 22px}
.mg{display:flex;flex-wrap:wrap;gap:6px}
.mg-c{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 13px var(--body);padding:6px 10px;border-radius:999px;cursor:pointer;min-height:32px}
.mg-c.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mg-c.s{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent)}
.mg-c:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mg-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mg-nav b{font:600 17px var(--display)}
.icon-btn:disabled{opacity:.3;cursor:default}
.mg-list{display:flex;flex-direction:column;gap:10px}
.mg-radar{display:block;width:100%;max-width:380px;margin:6px auto 0;overflow:visible}
.mgr{display:flex;flex-direction:column;gap:4px}
.mgr-h{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.mgr-h .muted{font-size:13px}
.mgr-t{display:flex;height:12px;background:var(--soft);border-radius:4px;overflow:hidden}
.mgr-d{background:var(--accent)}
.mgr-i{background:var(--accent);opacity:.4}
.welcome{display:flex;flex-direction:column;gap:12px;padding-block:24px}
.big-brand{font:700 italic 46px/1 var(--display);letter-spacing:.01em}
.brand{display:inline-flex;align-items:center;gap:8px}
.brand .logo{width:1.15em;height:1.15em;flex:none}
.bar h1.brand,.d-brand{font-style:italic}
.welcome-logo{width:96px;height:96px;border-radius:24px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.welcome-logo img,.welcome-logo svg{width:100%;height:100%;display:block}
.share{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.diag{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--warn)}
/* ---- Organización visual ---- */
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px;vertical-align:-3px}
.btn .ic{width:18px;height:18px}
.ptabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:4;background:var(--bg);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:6px 12px 8px;border-bottom:1px solid var(--line)}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{flex:1 1 0;min-width:44px;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--muted);font:600 11px var(--body);padding:6px 1px;border-radius:10px;cursor:pointer;white-space:nowrap}
@media (max-width:380px){.ptabs button{font-size:10px;letter-spacing:-.01em}}
.ptabs button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.ptabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.info{font-size:14px;color:var(--muted)}
.info summary{display:inline-flex;align-items:center;gap:6px;cursor:pointer;list-style:none;color:var(--muted);font-weight:600;padding:4px 0}
.info summary::-webkit-details-marker{display:none}
.info summary .ic{width:17px;height:17px}
.info[open] summary{color:var(--ink)}
.info>div{padding:6px 0 2px;line-height:1.5}
.starts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.start{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:0;border-radius:14px;padding:16px 14px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font:inherit;min-height:116px}
.start:nth-child(2){background:var(--surface);color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line))}
.start .ic{width:28px;height:28px;margin-bottom:auto}
.start:nth-child(2) .ic{color:var(--accent)}
.start b{font:700 18px/1.1 var(--display)}
.start span{font-size:13px;opacity:.85}
.start:focus-visible,.kpi:focus-visible,.pcard:focus-visible,.action:focus-visible,.fchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;color:var(--ink);font:inherit;min-width:0}
.kpi b{font:700 26px/1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.kpi span{font-size:12px;color:var(--muted);line-height:1.25}
.kpi .dot{position:absolute;top:12px;right:12px;width:10px;height:10px;border-radius:50%}
.kind{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.kind.hr{background:color-mix(in srgb,var(--z5) 16%,transparent);color:var(--z5)}
.kind.st{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.item .grow{display:flex;flex-direction:column;gap:1px}
.item .grow br{display:none}
.item.hl{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.wk-h{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:10px 2px 2px}
.chips-f{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 14px var(--body);padding:7px 13px;border-radius:999px;cursor:pointer}
.fchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.acwr-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.acwr-head>div{display:flex;flex-direction:column;gap:2px}
.big-num{font:700 46px/1 var(--display)}
.warnTxt{color:var(--warn)}
.prof-head{display:flex;align-items:center;gap:12px}
.avatar.lg{width:54px;height:54px;font-size:26px}
.pname{font:700 22px/1.1 var(--display);display:block}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pcard{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;color:var(--ink);font:inherit;text-align:left;min-width:0}
.pcard .grow{display:flex;flex-direction:column;gap:2px;min-width:0}
.pcard .t{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .s{font-size:13px;color:var(--muted)}
.pcard .tags{display:flex;gap:4px;flex-wrap:wrap}
.pcard .tags:empty{display:none}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:2px}
.acwr-mini{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:58px;padding:6px 8px;border-radius:10px;background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.acwr-mini b{font:700 20px/1 var(--display);color:var(--c)}
.acwr-mini span{font-size:10px;color:var(--muted);letter-spacing:.06em;font-weight:600}

/* ================= Lógica pura (zonas, parser, resumen) ================= */
const tanaka=a=>Math.round(208-0.7*a);
function zoneLimits(p){ // límites inferiores de Z1..Z5 en ppm
  if(p.method==='manual') return p.manual.map(Number);
  if(p.method==='karvonen'&&p.hrRest) return p.percents.map(x=>Math.round(p.hrRest+x/100*(p.hrMax-p.hrRest)));

}
function zoneOf(bpm,lim){let z=0;for(let i=0;i<5;i++)if(bpm>=lim[i])z=i+1;return z}
// Heart Rate Measurement 0x2A37 (little-endian)
function parseHR(dv){
  const f=dv.getUint8(0);let i=1,bpm;
  if(f&1){bpm=dv.getUint16(i,true);i+=2}else{bpm=dv.getUint8(i);i+=1}
  const contact=(f&4)?!!(f&2):null;
  if(f&8)i+=2;
  const rr=[];
  if(f&16){while(i+1<dv.byteLength){rr.push(Math.round(dv.getUint16(i,true)*1000/1024));i+=2}}
  return {bpm,contact,rr};
}
// samples: [t_ms, bpm, segmento]. Huecos >5 s = sin señal; cambio de segmento = pausa
function summarize(samples,lim){
  const zoneMs=[0,0,0,0,0,0];let sumB=0,sumT=0,max=0;
  for(let i=0;i<samples.length;i++){
    const [t,b,seg]=samples[i];if(b>max)max=b;
    const n=samples[i+1];if(!n||n[2]!==seg)continue;
    const dt=n[0]-t;if(dt<=0||dt>5000)continue;
    zoneMs[zoneOf(b,lim)]+=dt;sumB+=b*dt;sumT+=dt;
  }
  return {zoneMs,avgHr:sumT?Math.round(sumB/sumT):null,maxHr:max||null,coveredMs:sumT};
}
const srpe=s=>s.rpePost==null?null:Math.round(s.rpePost*s.activeMs/60000);
// TRIMP de Edwards (1993): minutos en cada zona × su peso (Z1 = 1 … Z5 = 5; Z0 no suma)
const trimp=s=>s.zoneMs?Math.round(s.zoneMs.reduce((a,ms,z)=>a+ms/60000*z,0)):null;
// Pico de FC sostenido (3 muestras seguidas) para no tomar como FC máxima un pico aislado del sensor
// Deportista: invitar a enviar justo después de registrar
function sendNudge(uid){const p=prof(uid);if(!isClient()||selfCoached()||!p||p.remote||p.cloudToken||!newSinceSent(p))return'';
  return `<div class="note info slim send-nudge">${ic('send')}<span class="hint grow"><b>¿Se lo mandas a tu entrenador?</b> ${newSinceSent(p)} registro${newSinceSent(p)===1?'':'s'} sin enviar.</span><button class="btn small primary" data-act="send">Enviar</button></div>`}
function hrMaxCard(s){const p=prof(s?.userId);if(!p||!s.peakHr||s.peakHr<=p.hrMax||s.hrMaxSeen)return'';
  return `<div class="note"><b>Has superado tu FC máxima</b><span class="hint num">Pico sostenido en esta sesión: <b>${s.peakHr} ppm</b>. FC máxima del perfil: ${p.hrMax} ppm${p.hrMaxEstimated?' (estimada)':''}. Si fue un esfuerzo real y no un error del sensor, actualízala para que las zonas sean correctas.${p.method==='manual'?' Ojo: las zonas de este perfil son manuales; revísalas después en Editar.':''}</span>
    <div class="row"><button class="btn small primary" data-act="hrMaxUpd" data-id="${s.id}">Usar ${s.peakHr} ppm y recalcular zonas</button><button class="btn small" data-act="hrMaxSkip" data-id="${s.id}">Ignorar</button></div></div>`}
function sustainedPeak(sm){let pk=0;for(let i=0;i+2<sm.length;i++){const a=sm[i],c=sm[i+2];if(a[2]!==c[2]||c[0]-a[0]>6000)continue;const m=Math.min(a[1],sm[i+1][1],c[1]);if(m>pk)pk=m}return pk||null}
// Carga diaria (UA) desde el primer día con datos hasta hoy, un valor por día natural
function dayKey(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function dailyLoads(items,today=Date.now()){
  const m=new Map();let first=null;
  for(const it of items){if(!it.load)continue;const k=dayKey(it.t);m.set(k,(m.get(k)||0)+it.load);if(first==null||k<first)first=k}
  const end=dayKey(today),out=[];if(first==null)return out;
  const d=new Date(first);
  while(d.getTime()<=end){out.push({t:d.getTime(),load:m.get(d.getTime())||0});d.setDate(d.getDate()+1)}
  return out;
}
// ACWR. 'ra': aguda = suma 7 d; crónica = media semanal de 28 d (suma 28 d / 4).
// 'ewma': Williams et al. (2017), λ = 2/(N+1) con N = 7 y 28, empezando en 0.
function acwrSeries(days,method){
  const la=2/8,lc=2/29;let ea=0,ec=0;
  return days.map((d,i)=>{
    let a7=0,a28=0;for(let j=Math.max(0,i-27);j<=i;j++){a28+=days[j].load;if(j>i-7)a7+=days[j].load}
    ea=d.load*la+(1-la)*ea;ec=d.load*lc+(1-lc)*ec;
    const ratio=method==='ewma'?(ec>0?ea/ec:null):(a28>0?a7/(a28/4):null);
    return {t:d.t,acute:a7,month:a28,ratio:ratio==null?null:Math.round(ratio*100)/100,enough:i>=27};
  });
}
/* Fuerza: volumen-carga = Σ reps × kg; RPE CR-10 por serie; 1RM estimado con la fórmula elegida */
// w = kg, r = repeticiones. Solo se usan series de 1 a 10 repeticiones.
const RM_FORMULAS={
  brzycki:{name:'Brzycki',f:(w,r)=>w*36/(37-r)},
  epley:{name:'Epley',f:(w,r)=>r===1?w:w*(1+r/30)},
  landers:{name:'Landers',f:(w,r)=>w/(1.013-0.0267123*r)},
  mayhew:{name:'Mayhew et al.',f:(w,r)=>w/(0.522+0.419*Math.exp(-0.055*r))},
  wathen:{name:'Wathen',f:(w,r)=>w/(0.488+0.538*Math.exp(-0.075*r))},
  kemmler:{name:'Kemmler et al.',f:(w,r)=>w*(0.988+0.0104*r+0.0019*r*r-0.0000584*r*r*r)},
  lombardi:{name:'Lombardi',f:(w,r)=>w*Math.pow(r,0.1)},
  oconner:{name:"O'Conner et al.",f:(w,r)=>w*(1+0.025*r)},
  media:{name:'Media de Brzycki, Epley, Landers, Mayhew y Wathen'}
};
function oneRM(w,r,key='brzycki'){
  if(!(w>0)||!(r>=1)||r>10)return null;
  if(r===1)return w; // una repetición: el propio peso
  if(key==='media'){const ks=['brzycki','epley','landers','mayhew','wathen'];return ks.reduce((a,k)=>a+RM_FORMULAS[k].f(w,r),0)/ks.length}
  return (RM_FORMULAS[key]||RM_FORMULAS.brzycki).f(w,r);
}
// Identidad de un ejercicio: nombre + variante, sin distinguir mayúsculas, tildes ni espacios de más
const normTxt=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
// Unilateral forma parte de la identidad: no se compara con la versión bilateral
const exKey=e=>normTxt(e.name)+'|'+normTxt(e.variant)+(e.unilateral?'|u':'');
const exLabel=e=>(e.name||'').trim()+(normTxt(e.variant)?' · '+e.variant.trim():'')+(e.unilateral?' · unilateral':'');
const SIDE={I:'Izq.',D:'Der.'};
// Pliometría: cada serie guarda contactos (apoyos/saltos; en unilaterales, por pierna), intensidad (1 baja · 2 media · 3 alta) y RPE
const PLYO_KEYS=['salto','jump','cmj','drop','pliom','plio','bote','pogo','skipping','bound','multisalto','comba','rebote','abalakov','depth','vallas','hop','skater','tuck'];
const isPlyoName=n=>{n=normTxt(n);return !!n&&PLYO_KEYS.some(k=>n.includes(k))};
const INT=['','Baja','Media','Alta'],INTS=['','B','M','A'];
const intOpts=v=>`<option value=""${!v?' selected':''}>—</option>`+[1,2,3].map(i=>`<option value="${i}"${+v===i?' selected':''}>${INT[i]}</option>`).join('');
const intTxt=b=>[3,2,1].filter(i=>b[i]).map(i=>`${b[i]} ${INT[i].toLowerCase()}`).join(' · ');
// Asimetría = (lado fuerte − lado débil) / lado fuerte × 100
const asym=(a,b)=>{const hi=Math.max(a,b),lo=Math.min(a,b);return hi>0?(hi-lo)/hi*100:null};
function strengthStats(st,formula='brzycki'){
  let vol=0,sets=0,reps=0,rs=0,rn=0;
  let contacts=0,plyoSets=0;const byInt={1:0,2:0,3:0};
  let ris=0,rin=0;
  const ex=(st.exercises||[]).map(e=>{let v=0,r=0,n=0,es=0,en=0,xs=0,xn=0,top=null,e1=0,rmSet=null;
    if(e.plyo){const sd={I:0,D:0},bi={1:0,2:0,3:0};let c=0;
      for(const s of e.sets||[]){const rp=+s.reps;if(!(rp>0))continue;n++;c+=rp;if(+s.int)bi[+s.int]+=rp;if(e.unilateral&&s.side in sd)sd[s.side]++;if(s.rpe!=null&&s.rpe!==''){es+=+s.rpe;en++}if(s.rir!=null&&s.rir!==''){xs+=+s.rir;xn++}}
      const series=e.unilateral?Math.max(sd.I,sd.D):n;contacts+=c;plyoSets+=series;rs+=es;rn+=en;ris+=xs;rin+=xn;for(const k in bi)byInt[k]+=bi[k];
      return {name:e.name,variant:e.variant||'',unilateral:!!e.unilateral,label:exLabel(e),plyo:true,contacts:c,byInt:bi,vol:0,sets:series,reps:0,rpe:en?es/en:null,rir:xn?xs/xn:null,top:null,e1rm:null,rmSet:null}}
    const sd={I:{vol:0,reps:0,sets:0,e1rm:0,rmSet:null},D:{vol:0,reps:0,sets:0,e1rm:0,rmSet:null}};
    for(const s of e.sets||[]){const rp=+s.reps,kg=+s.kg||0;if(!(rp>0))continue;
      n++;r+=rp;v+=rp*kg;
      if(s.rpe!=null&&s.rpe!==''){es+=+s.rpe;en++}
      if(s.rir!=null&&s.rir!==''){xs+=+s.rir;xn++}
      const est=kg>0?oneRM(kg,rp,formula):null;
      if(kg>0){if(est!=null&&est>e1){e1=est;rmSet=s}if(!top||kg>+top.kg||(kg===+top.kg&&rp>+top.reps))top=s}
      if(e.unilateral&&sd[s.side]){const x=sd[s.side];x.vol+=rp*kg;x.reps+=rp;x.sets++;if(est!=null&&est>x.e1rm){x.e1rm=est;x.rmSet=s}}}
    const series=e.unilateral?Math.max(sd.I.sets,sd.D.sets):n;
    vol+=v;sets+=series;reps+=r;rs+=es;rn+=en;ris+=xs;rin+=xn;
    for(const k of ['I','D'])sd[k].e1rm=sd[k].e1rm?Math.round(sd[k].e1rm*2)/2:null;
    const uni=e.unilateral?{sides:sd,asymVol:asym(sd.I.vol,sd.D.vol),asymRM:sd.I.e1rm&&sd.D.e1rm?asym(sd.I.e1rm,sd.D.e1rm):null}:{};
    return {name:e.name,variant:e.variant||'',unilateral:!!e.unilateral,label:exLabel(e),vol:Math.round(v*10)/10,sets:series,reps:r,rpe:en?es/en:null,rir:xn?xs/xn:null,top,e1rm:e1?Math.round(e1*2)/2:null,rmSet,...uni}});
  return {vol:Math.round(vol),sets,reps,rpe:rn?rs/rn:null,rir:rin?ris/rin:null,ex,contacts,plyoSets,byInt};
}
const stLoad=st=>st.rpePost==null||!(st.durationMin>0)?null:Math.round(st.rpePost*st.durationMin);

const MG=[['back','Espalda','Espalda'],['shoulders','Hombros','Hombros'],['chest','Pecho','Pecho'],['triceps','Tríceps','Tríceps'],['biceps','Bíceps','Bíceps'],
  ['core','Core','Core'],['quads','Muslo anterior','Muslo ant.'],['hams','Muslo posterior (isquios)','Muslo post.'],['glutes','Glúteo','Glúteo'],['add','Aductores','Aductores'],['calves','Pantorrillas','Pantorrillas']];

const MG_RULES=[
  [['aductor','aduccion','copenhague','copenhagen'],{add:'p'}],
  [['curl femoral','nordic','isquio'],{hams:'p'}],
  [['good morning','buenos dias','hiperextension'],{hams:'p',glutes:'s',back:'s'}],
  [['hip thrust','puente de gluteo','patada de gluteo','abduc','gluteo','clamshell','almeja','monster walk'],{glutes:'p'}],
  [['peso muerto rumano','rumano','stiff','piernas rigidas'],{hams:'p',glutes:'s',back:'s'}],
  [['peso muerto','deadlift','trap bar','swing'],{glutes:'p',hams:'s',quads:'s',back:'s'}],
  [['gemelo','pantorrilla','talones','soleo','calf'],{calves:'p'}],
  [['extension de cuadriceps','extension de pierna','sissy'],{quads:'p'}],
  [['sentadilla','squat','prensa','zancada','lunge','step up','subida al cajon','pistol'],{quads:'p',glutes:'s'}],
  [['extension de triceps','press frances','triceps','fondos en banco','patada de triceps'],{triceps:'p'}],
  [['curl','martillo','biceps','antebrazo'],{biceps:'p'}],
  [['fondos','dips'],{chest:'p',triceps:'s',shoulders:'s'}],
  [['press inclinado'],{chest:'p',shoulders:'s',triceps:'s'}],
  [['aperturas','cruce de poleas','pec deck'],{chest:'p'}],
  [['press banca','banca','press de pecho','flexiones','push up'],{chest:'p',triceps:'s'}],
  [['landmine'],{shoulders:'p',chest:'s',triceps:'s'}],
  [['elevaciones laterales','elevacion lateral','elevaciones frontales','pajaro','face pull'],{shoulders:'p'}],
  [['press militar','press de hombro','press arnold','push press','hombro'],{shoulders:'p',triceps:'s'}],
  [['dominada','pull up','chin up','jalon','remo','pull over','pullover','encogimiento'],{back:'p',biceps:'s'}],
  [['plancha','crunch','rueda','pallof','dead bug','abdominal','core','rotacion','lenador','hollow','rueda abdominal','farmer','paseo del granjero'],{core:'p'}]];
// Datos antiguos: «post» (muslo posterior y glúteo) y «arms» (brazos) se reparten en los grupos nuevos según el ejercicio
function fixLegacyM(m,name){if(!m||!(m.post||m.arms))return m;const out={...m},sg=suggestMuscles(name)||{};delete out.post;delete out.arms;

function suggestMuscles(name){const n=normTxt(name);if(!n)return null;
  for(const [keys,m] of MG_RULES)if(keys.some(k=>n.includes(k)))return {...m};return {}}
const musclesOf=e=>fixLegacyM(e.muscles,e.name)||(l=>l&&Object.keys(l.muscles||{}).length?{...l.muscles}:null)(libFind(e.name))||suggestMuscles(e.name)||{};

function muscleVolume(sessions){
  const out={},un={sets:0,kg:0};for(const [g] of MG)out[g]={sets:0,setsD:0,kg:0,kgD:0};
  for(const st of sessions){const k=strengthStats(st);
    st.exercises.forEach((e,i)=>{const x=k.ex[i];if(!x||!x.sets||x.plyo)return;const m=musclesOf(e),gs=Object.keys(m).filter(g=>out[g]);

/* ================= Batería de ejercicios ================= */
// Patrones de movimiento. La batería base viene con la app; lo que añade o cambia el entrenador se guarda en «exercises»

function libAll(){const own=new Map((S.exercises||[]).map(x=>[x.id,x]));
  const fx=x=>x.muscles?{...x,muscles:fixLegacyM(x.muscles,x.name)}:x;
  const out=BASE_EX.map(b=>own.has(b.id)?fx({...b,...own.get(b.id),base:true,edited:true}):b);
  for(const x of own.values())if(!x.id.startsWith('b-'))out.push(fx(x));
  return out.filter(x=>!x.hidden&&x.name).sort((a,b)=>a.name.localeCompare(b.name,'es'))}
function libFind(name){const n=normTxt(name);if(!n)return null;return libAll().find(x=>normTxt(x.name)===n)||null}

/* ===== Test: cálculos ===== */
function linreg(xs,ys){const n=xs.length;if(n<2)return null;
  const mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n;let sxy=0,sxx=0,syy=0;
  for(let i=0;i<n;i++){sxy+=(xs[i]-mx)*(ys[i]-my);sxx+=(xs[i]-mx)**2;syy+=(ys[i]-my)**2}
  if(!sxx)return null;const b=sxy/sxx;return {a:my-b*mx,b,r2:syy?sxy*sxy/(sxx*syy):1}}
// ACSM, cicloergómetro de piernas: VO2 = 1,8·WR/masa + 7, con WR en kg·m/min (1 W = 6,12 kg·m/min)
const acsmCycleVO2=(w,kg)=>1.8*w*6.12/kg+7;
// Protocolo YMCA: 25 W y, según la FC de la 1.ª etapa, 2.ª etapa a 125/100/75/50 W; después +25 W
function ymcaNext(stages){const v=stages.filter(s=>+s.w>0);if(!v.length)return 25;
  if(v.length===1){const hr=+v[0].hr;if(!hr)return null;return hr<80?125:hr<90?100:hr<=100?75:50}
  return +v[v.length-1].w+25}
function vo2Calc(t){
  const st=(t.stages||[]).filter(s=>+s.w>0&&+s.hr>0).map(s=>({w:+s.w,hr:+s.hr}));
  const hi=st.filter(s=>s.hr>=110),pts=hi.length>=2?hi:st;
  const res={n:st.length,used:pts.length,low:hi.length<2&&st.length>=2};
  const lr=pts.length>=2?linreg(pts.map(s=>s.w),pts.map(s=>s.hr)):null;
  if(lr&&lr.b>0&&t.hrMax>0&&t.weight>0){const wMax=(t.hrMax-lr.a)/lr.b;res.hr={lr,wMax,vo2:acsmCycleVO2(wMax,t.weight)};res.hr.abs=res.hr.vo2*t.weight/1000}
  else if(lr&&lr.b<=0)res.flat=true;
  const rp=(t.stages||[]).filter(s=>+s.w>0&&s.rpe!=null&&s.rpe!=='').map(s=>({w:+s.w,r:+s.rpe}));
  const lr2=rp.length>=2?linreg(rp.map(s=>s.w),rp.map(s=>s.r)):null;
  if(lr2&&lr2.b>0&&t.weight>0){const w19=(19-lr2.a)/lr2.b,w20=(20-lr2.a)/lr2.b;res.rpe={lr:lr2,w19,w20,vo2_19:acsmCycleVO2(w19,t.weight),vo2_20:acsmCycleVO2(w20,t.weight)}}
  res.over85=t.hrMax>0&&st.some(s=>s.hr>0.85*t.hrMax);
  return res}
// Ajuste polinómico por mínimos cuadrados (Gauss con pivote)
function polyfit(xs,ys,deg){const m=deg+1,A=Array.from({length:m},()=>Array(m+1).fill(0));
  for(let i=0;i<xs.length;i++){const p=[];for(let k=0;k<2*m;k++)p.push(xs[i]**k);
    for(let r=0;r<m;r++){for(let c=0;c<m;c++)A[r][c]+=p[r+c];A[r][m]+=ys[i]*p[r]}}
  for(let c=0;c<m;c++){let pv=c;for(let r=c+1;r<m;r++)if(Math.abs(A[r][c])>Math.abs(A[pv][c]))pv=r;[A[c],A[pv]]=[A[pv],A[c]];
    if(Math.abs(A[c][c])<1e-12)return null;
    for(let r=0;r<m;r++){if(r===c)continue;const f=A[r][c]/A[c][c];for(let k=c;k<=m;k++)A[r][k]-=f*A[c][k]}}
  return A.map((row,i)=>row[m]/row[i])}
const polyval=(co,x)=>co.reduce((a,c,i)=>a+c*x**i,0);
// Dmax: punto de la curva FC–potencia (ajuste cúbico) más alejado de la cuerda entre la primera y la última etapa
function dmax(ws,hrs){
  if(ws.length<5)return null;const S0=100,X=ws.map(w=>w/S0),co=polyfit(X,hrs,3);if(!co)return null;
  const x0=Math.min(...X),x1=Math.max(...X),y0=polyval(co,x0),y1=polyval(co,x1),m=(y1-y0)/(x1-x0);
  let best=null;for(let i=1;i<500;i++){const x=x0+(x1-x0)*i/500,d=polyval(co,x)-(y0+m*(x-x0));if(!best||d>best.d)best={x,d}}
  return {w:best.x*S0,hr:polyval(co,best.x),d:best.d,co,S0,x0:x0*S0,x1:x1*S0,y0,y1,found:best.d>=1.5}}
function interpAt(pts,x){const v=pts.filter(p=>p[1]!=null).sort((a,b)=>a[0]-b[0]);if(!v.length)return null;
  if(x<=v[0][0])return v[0][1];for(let i=1;i<v.length;i++)if(x<=v[i][0]){const a=v[i-1],b=v[i];return a[1]+(b[1]-a[1])*(x-a[0])/((b[0]-a[0])||1)}return v[v.length-1][1]}
function vt2Calc(t){
  const st=(t.stages||[]).filter(s=>+s.w>0&&+s.hr>0).map(s=>({w:+s.w,hr:+s.hr,rpe:s.rpe===''||s.rpe==null?null:+s.rpe})).sort((a,b)=>a.w-b.w);
  const res={n:st.length,wPeak:st.length?st[st.length-1].w:null,hrPeak:st.length?Math.max(...st.map(s=>s.hr)):null};
  const d=dmax(st.map(s=>s.w),st.map(s=>s.hr));res.dmax=d;
  const mw=+t.measured?.w,mh=+t.measured?.hr;
  const src=mw>0?{w:mw,hr:mh>0?mh:(d?polyval(d.co,mw/d.S0):null),how:'medido'}:(d&&d.found?{w:d.w,hr:d.hr,how:'dmax'}:null);
  if(src){src.pctHrMax=t.hrMax>0&&src.hr?src.hr/t.hrMax*100:null;src.pctWpeak=res.wPeak?src.w/res.wPeak*100:null;
    src.rpe=interpAt(st.map(s=>[s.w,s.rpe]),src.w);res.vt2=src}
  return res}
// Saltos: altura en cm. Potencia pico de Sayers et al. (1999) = 60,7·h + 45,3·masa − 2055
const sayers=(hcm,kg)=>60.7*hcm+45.3*kg-2055;
function jumpCalc(t){const out={};
  for(const k of ['cmj','sj','abk']){const v=(t.jumps?.[k]||[]).map(Number).filter(x=>x>0);
    out[k]=v.length?{best:Math.max(...v),mean:v.reduce((a,b)=>a+b,0)/v.length,n:v.length,cv:v.length>1?Math.sqrt(v.reduce((a,b)=>a+(b-v.reduce((x,y)=>x+y,0)/v.length)**2,0)/(v.length-1))/(v.reduce((a,b)=>a+b,0)/v.length)*100:null}:null;
    if(out[k]&&t.weight>0&&k!=='abk'){out[k].pp=sayers(out[k].best,t.weight);out[k].ppkg=out[k].pp/t.weight}}
  if(out.cmj&&out.sj)out.elastic=(out.cmj.best-out.sj.best)/out.sj.best*100;
  if(out.abk&&out.cmj)out.arms=(out.abk.best-out.cmj.best)/out.cmj.best*100;
  return out}
function acwrStatus(r){
  if(r==null)return{txt:'Sin datos',z:0};
  if(r<0.8)return{txt:'Carga baja',z:2};
  if(r<=1.3)return{txt:'Zona óptima',z:3};
  if(r<=1.5)return{txt:'Precaución',z:4};
  return{txt:'Riesgo elevado',z:5};
}

const DB={db:null,mem:null,
  async open(){

    try{
      this.db=await new Promise((res,rej)=>{const r=indexedDB.open('pulsometro',6);

const loadItems=uid=>allOf(uid).map(s=>({t:s.startTime,load:loadOfAny(s)}));
const volItems=uid=>stOf(uid).map(s=>({t:s.startTime,load:strengthStats(s).vol}));
function loadBuckets(items,mode){
  const out=[];
  if(mode==='month'){const d=new Date();d.setDate(1);d.setHours(0,0,0,0);
    for(let i=5;i>=0;i--){const a=new Date(d.getFullYear(),d.getMonth()-i,1).getTime(),b=new Date(d.getFullYear(),d.getMonth()-i+1,1).getTime();
      out.push({label:new Date(a).toLocaleDateString('es-ES',{month:'short'}).replace('.',''),v:items.filter(x=>x.t>=a&&x.t<b).reduce((s,x)=>s+(x.load||0),0)})}}
  else{const now=weekStart(Date.now());
    for(let i=7;i>=0;i--){const ws=new Date(now);ws.setDate(ws.getDate()-7*i);const a=ws.getTime(),e=new Date(ws);e.setDate(e.getDate()+7);
      out.push({label:ws.getDate()+'/'+(ws.getMonth()+1),v:items.filter(x=>x.t>=a&&x.t<e.getTime()).reduce((s,x)=>s+(x.load||0),0)})}}
  return out;
}
function drawBars(el,buckets){
  if(!el)return;const {c,w,h}=cv(el);
  const max=Math.max(100,...buckets.map(x=>x.v)),L=6,B=20,T=18,bw=(w-L*2)/buckets.length;
  c.font='11px '+css('--mono');c.textAlign='center';
  buckets.forEach((x,i)=>{const bh=(h-T-B)*x.v/max,xx=L+i*bw+bw*.18,ww=bw*.64;
    c.fillStyle=i===buckets.length-1?css('--accent'):css('--z1');c.globalAlpha=x.v?1:.25;
    c.fillRect(xx,h-B-Math.max(bh,2),ww,Math.max(bh,2));c.globalAlpha=1;
    c.fillStyle=css('--ink');if(x.v)c.fillText(x.v,xx+ww/2,h-B-bh-6);
    c.fillStyle=css('--muted');c.fillText(x.label,xx+ww/2,h-5)});
}
function drawAcwr(el,ser){
  if(!el)return;const {c,w,h}=cv(el);
  const pts=ser.slice(-42),L=30,R=30,T=8,B=20,pw=w-L-R,ph=h-T-B;
  const muted=css('--muted'),ink=css('--ink');
  const vals=pts.map(p=>p.ratio).filter(v=>v!=null);
  // Escala por los días con datos suficientes; el arranque (muy inestable) se recorta arriba
  const good=pts.filter(p=>p.enough&&p.ratio!=null).map(p=>p.ratio);
  const hi=Math.min(3,Math.max(2,Math.ceil((Math.max(0,...good)+0.1)*4)/4));
  const Y=v=>T+(1-v/hi)*ph,X=i=>L+(pts.length>1?i/(pts.length-1):0.5)*pw;
  [[0,0.8,2],[0.8,1.3,3],[1.3,1.5,4],[1.5,hi,5]].forEach(([a,b,z])=>{c.fillStyle=zc(z);c.globalAlpha=.13;c.fillRect(L,Y(b),pw,Y(a)-Y(b))});
  c.globalAlpha=1;c.font='10px '+css('--mono');c.textAlign='right';c.textBaseline='middle';
  for(const v of [0.8,1.3,1.5]){const y=Math.round(Y(v))+.5;c.strokeStyle=css('--line');c.lineWidth=1;c.beginPath();c.moveTo(L,y);c.lineTo(L+pw,y);c.stroke();c.fillStyle=muted;c.fillText(dec(v,1),L-5,y)}
  if(!vals.length){c.textAlign='center';c.font='14px '+css('--body');c.fillText('Sin carga registrada todavía',L+pw/2,T+ph/2);return}
  // fechas
  c.textAlign='center';c.textBaseline='top';
  pts.forEach((p,i)=>{if((pts.length-1-i)%7===0){const d=new Date(p.t);c.fillText(d.getDate()+'/'+(d.getMonth()+1),Math.min(Math.max(X(i),L+12),L+pw-12),h-B+5)}});
  // línea: tramo con menos de 28 días de datos más tenue
  c.save();c.beginPath();c.rect(L,T,pw,ph);c.clip();
  c.lineWidth=2.2;c.lineJoin='round';c.strokeStyle=ink;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];if(a.ratio==null||b.ratio==null)continue;
    c.globalAlpha=b.enough?1:.35;c.setLineDash(b.enough?[]:[4,4]);c.beginPath();c.moveTo(X(i-1),Y(a.ratio));c.lineTo(X(i),Y(b.ratio));c.stroke()}
  c.restore();c.globalAlpha=1;c.setLineDash([]);
  const li=pts.length-1,lv=pts[li].ratio;
  if(lv!=null&&lv<=hi){c.fillStyle=zc(acwrStatus(lv).z);c.beginPath();c.arc(X(li),Y(lv),5,0,7);c.fill();c.strokeStyle=css('--surface');c.lineWidth=2;c.stroke();
    c.fillStyle=ink;c.textAlign='left';c.textBaseline='middle';c.font='700 13px '+css('--display');c.fillText(dec(lv,2),Math.min(X(li)+8,w-26),Y(lv))}
}

  for(let z=5;z>=0;z--){const p=tot?zoneMs[z]/tot*100:0;
    h+=`<div class="zb-r"><span class="k" style="color:${zc(z)}">Z${z}</span><div class="zb-t"><div class="zb-f" id="zf${z}" style="width:${p}%;background:${zc(z)}"></div></div><span class="v" id="zv${z}">${fmtDur(zoneMs[z])}</span><span class="p" id="zp${z}">${Math.round(p)} %</span></div>`}

}

function validate(f){
  if(!f.name)return'Escribe un nombre.';
  if(!(f.hrMax>=100&&f.hrMax<=240))return'La FC máxima debe estar entre 100 y 240 ppm.';
  if(f.hrRest&&!(f.hrRest>=25&&f.hrRest<f.hrMax-20))return'Revisa la FC en reposo.';
  if(f.weight&&!(f.weight>=20&&f.weight<=250))return'Revisa el peso.';
  if(f.method==='karvonen'&&!f.hrRest)return'Karvonen necesita la FC en reposo. Escríbela o elige % FCmáx.';
  const arr=f.method==='manual'?f.manual:f.percents;
  if(arr.some(x=>isNaN(x)))return'Completa el inicio de las cinco zonas.';
  for(let i=1;i<5;i++)if(arr[i]<=arr[i-1])return'Cada zona tiene que empezar por encima de la anterior.';
  if(f.method==='manual'&&arr[4]>=f.hrMax)return'Z5 tiene que empezar por debajo de la FC máxima.';
  return null;
}

function ivState(r){const bs=r.blocks,a=recActive(r);let acc=0;
  for(let i=0;i<bs.length;i++){const e=acc+bs[i].min*60000;if(a<e)return {i,left:e-a,elapsed:a-acc};acc=e}
  return {i:bs.length,left:0,elapsed:0}}
function ivTick(r,final){if(!r?.blocks)return;const st=ivState(r),n=r.blocks.length;
  const close=k=>{const b=r.blocks[k];if(!b||r.ivRes[k])return;r.ivRes[k]={zone:b.zone,min:b.min,inMs:Math.max(0,Math.min(b.min*60000,r.inc.zoneMs[b.zone]-r.ivBase))}};
  if(final){if(r.ivi<n)close(r.ivi);return}
  if(st.i!==r.ivi){for(let k=r.ivi;k<Math.min(st.i,n);k++)close(k);r.ivi=st.i;
    if(st.i<n){const b=r.blocks[st.i];r.ivBase=r.inc.zoneMs[b.zone];beep();alertUser(`Bloque ${st.i+1}/${n}: Z${b.zone}`,`${fmtBl(b.min)} en Z${b.zone}${st.i+1<n?' · luego '+fmtBl(r.blocks[st.i+1].min)+' Z'+r.blocks[st.i+1].zone:''}`);toast(`Bloque ${st.i+1}: ${fmtBl(b.min)} en Z${b.zone}`)}
    else{beep();alertUser('Intervalos completados','Puedes seguir o finalizar la sesión');toast('¡Intervalos completados!');keepAlive('iv',false)}}
  else if(st.i<n&&r.running){const s=Math.ceil(st.left/1000);if(s<=3&&s>=1&&r.ivPip!==st.i*10+s){r.ivPip=st.i*10+s;schedBeeps(0,'pip')}}

  const done=ivTotal(bs.slice(0,st.i))*60000+st.elapsed,pct=Math.min(100,done/(ivTotal(bs)*600));

// Tela de araña del volumen por grupo: periodo actual (relleno) y anterior (discontinuo), a la misma escala
function mgRadar(cur,prv,K,label){const n=MG.length,cx=160,cy=125,R=82,vals=MG.map(([g])=>cur.groups[g][K]),pvs=MG.map(([g])=>prv.groups[g][K]);
  const max=Math.max(1e-9,...vals,...pvs);if(!vals.some(v=>v>0)&&!pvs.some(v=>v>0))return '';
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const poly=vs=>vs.map((v,i)=>pt(i,R*v/max).map(x=>x.toFixed(1)).join(',')).join(' ');
  const rings=[.25,.5,.75,1].map(f=>`<polygon points="${MG.map((_,i)=>pt(i,R*f).map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join('');
  const axes=MG.map((_,i)=>{const [x,y]=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`}).join('');
  const labs=MG.map(([g,,sh],i)=>{const [x,y]=pt(i,R+14),c=Math.cos(-Math.PI/2+i*2*Math.PI/n),anc=Math.abs(c)<.2?'middle':c>0?'start':'end';
    return `<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${anc}" font-size="11" fill="var(--muted)">${esc(sh)}</text>`}).join('');
  const dots=vals.map((v,i)=>{const [x,y]=pt(i,R*v/max);return v>0?`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--accent)"/>`:''}).join('');
  return `<svg class="mg-radar" viewBox="0 0 320 250" role="img" aria-label="Tela de araña del volumen por grupo muscular">${rings}${axes}
    ${pvs.some(v=>v>0)?`<polygon points="${poly(pvs)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>`:''}
    <polygon points="${poly(vals)}" fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>${dots}${labs}</svg>
    <div class="acwr-key"><span><i style="background:var(--accent)"></i>${esc(label)}</span><span><i style="background:transparent;border:1.5px dashed var(--muted)"></i>Periodo anterior</span></div>`}
function mgCard(uid){
  const per=lsGet('mgPer')==='month'?'month':'week',met=lsGet('mgMetric')==='kg'?'kg':'sets',off=S.mgOff||0;
  const P=mgPeriod(per,off),Pp=mgPeriod(per,off-1),sts=stOf(uid),inP=sts.filter(s=>s.startTime>=P.a&&s.startTime<P.b);
  const cur=muscleVolume(inP),prv=muscleVolume(sts.filter(s=>s.startTime>=Pp.a&&s.startTime<Pp.b));
  const K=met==='kg'?'kg':'sets',KD=met==='kg'?'kgD':'setsD',fmt=v=>met==='kg'?fmtKg(Math.round(v)):dec(v,Number.isInteger(v)?0:1);
  const tot=MG.reduce((a,[g])=>a+cur.groups[g][K],0),max=Math.max(1e-9,...MG.map(([g])=>cur.groups[g][K]));
  const rows=MG.map(([g,label])=>{const x=cur.groups[g],v=x[K],d=x[KD],pv=prv.groups[g][K];
    return `<div class="mgr"><div class="mgr-h"><span>${label}</span><span class="num"><b>${fmt(v)}</b><span class="muted"> · ${tot?Math.round(v/tot*100):0} %${pv||v?` · ant. ${fmt(pv)}`:''}</span></span></div>
      <div class="mgr-t" aria-hidden="true"><div class="mgr-d" style="width:${v?d/max*100:0}%"></div><div class="mgr-i" style="width:${v?(v-d)/max*100:0}%"></div></div></div>`}).join('');
  return `<div class="card">
    <div class="sec-h"><span class="lbl">Volumen por grupo muscular</span></div>
    <div class="g2"><div class="seg two" role="radiogroup" aria-label="Periodo">
      <button type="button" role="radio" aria-checked="${per==='week'}" class="${per==='week'?'on':''}" data-act="mgPer" data-v="week">Semana</button>
      <button type="button" role="radio" aria-checked="${per==='month'}" class="${per==='month'?'on':''}" data-act="mgPer" data-v="month">Mes</button></div>
    <div class="seg two" role="radiogroup" aria-label="Medida">
      <button type="button" role="radio" aria-checked="${met==='sets'}" class="${met==='sets'?'on':''}" data-act="mgMetric" data-v="sets">Series</button>
      <button type="button" role="radio" aria-checked="${met==='kg'}" class="${met==='kg'?'on':''}" data-act="mgMetric" data-v="kg">Kg</button></div></div>
    <div class="mg-nav"><button class="icon-btn" data-act="mgMove" data-v="-1" aria-label="Periodo anterior">‹</button><b>${P.label.charAt(0).toUpperCase()+P.label.slice(1)}</b><button class="icon-btn" data-act="mgMove" data-v="1" aria-label="Periodo siguiente" ${off>=0?'disabled':''}>›</button></div>
    <span class="hint num">${inP.length} sesi${inP.length===1?'ón':'ones'} de fuerza · total ${fmt(tot)} ${met==='kg'?'kg':'series'}</span>
    ${mgRadar(cur,prv,K,P.label.charAt(0).toUpperCase()+P.label.slice(1))}
    <div class="mg-list">${rows}</div>
    ${cur.unassigned.sets?`<span class="hint">${fmt(met==='kg'?cur.unassigned.kg:cur.unassigned.sets)} ${met==='kg'?'kg':'series'} sin grupo asignado. Asígnalo en la sesión para que cuente.</span>`:''}
    <div class="acwr-key"><span><i style="background:var(--accent)"></i>Principal</span><span><i style="background:var(--accent);opacity:.4"></i>Secundario (½)</span></div>
    ${info('Recuento fraccional: cada serie suma 1 al grupo principal del ejercicio y 0,5 a los secundarios. En unilaterales cuenta una serie por cada par izquierda-derecha. Los grupos de cada ejercicio se asignan en el registro de la sesión.')}
  </div>`}
const stTotHTML=t=>stat(fmtKg(t.vol),'Kg totales')+stat(t.sets,'Series fuerza')+(t.contacts?stat(t.contacts,'Contactos'):'')+(t.rir!=null?stat(dec(t.rir,1),'RIR medio'):'')+(t.rpe!=null||t.rir==null?stat(t.rpe!=null?dec(t.rpe,1):'—','RPE medio'):'');
let stSaveT=null;
// Una sesión de fuerza recién abierta sin nada anotado es un borrador: no cuenta como «en curso» y se descarta al salir
const stEmpty=st=>!st.planId&&!(st.exercises||[]).some(e=>normTxt(e.name)||e.sets.some(x=>(x.reps!=null&&x.reps!=='')||(x.kg!=null&&x.kg!=='')));
function dropDraft(id){const st=stById(id);if(!st||st.status!=='open'||!stEmpty(st))return;clearTimeout(stSaveT);S.strength=S.strength.filter(x=>x.id!==id);DB.del('strength',id)}
function saveStSoon(st){clearTimeout(stSaveT);stSaveT=setTimeout(()=>DB.put('strength',st),400)}
async function saveSt(st){clearTimeout(stSaveT);await DB.put('strength',st);const i=S.strength.findIndex(x=>x.id===st.id);if(i<0)S.strength.push(st);else S.strength[i]=st}
V.stpost=()=>{const st=stById(S.arg);const t=strengthStats(st);if(S.form.rpePost===undefined)S.form.rpePost=st.rpePost??null;
  return `<div class="card"><span class="lbl">Sesión de fuerza terminada</span><div class="stats">${stTotHTML(t)}</div>
  <div class="field"><label for="stDur">Duración (minutos)</label><input id="stDur" type="number" inputmode="numeric" min="1" value="${st.durationMin||''}" placeholder="min" required><span class="hint">Tiempo total de la sesión, descansos incluidos. Se usa para el sRPE.</span></div></div>
  <section class="sec"><h3>RPE de la sesión</h3><span class="hint">¿Cómo de dura ha sido la sesión en conjunto? Lo ideal es contestarlo unos 30 minutos después. Puedes dejarlo para luego.</span>${rpeScale('rpePost','post',S.form.rpePost)}</section>
  <div class="card"><div class="field"><label for="stNotes">Notas</label><textarea id="stNotes" placeholder="Sensaciones, molestias, técnica…">${esc(st.notes)}</textarea></div></div>

  <div class="ctrls"><button class="btn" data-act="stLater">Anotar más tarde</button><button class="btn" data-act="remind">Avisarme en 30 min</button></div>`};
V.ssum=()=>{
  const st=stById(S.arg);if(!st)return'';const fk=rmKey(),t=strengthStats(st,fk),l=stLoad(st),p=prof(st.userId);
  const maxV=Math.max(1,...t.ex.map(e=>e.vol));
  let h=`${st.rpePost!=null?sendNudge(st.userId):''}<div class="card"><div class="sec-h"><span class="lbl">${fmtDT(st.startTime)} · ${esc(p?.name||'')}</span>${st.example?'<span class="tag ex">Ejemplo</span>':''}</div>
  <div class="stats">${stat((st.durationMin||'—')+(st.durationMin?'′':''),'Duración')}${stat(fmtKg(t.vol),'Kg totales')}${stat(t.sets,'Series fuerza')}${t.contacts?stat(t.contacts,'Contactos'):''}${t.rir!=null?stat(dec(t.rir,1),'RIR medio'):''}${t.rpe!=null||t.rir==null?stat(t.rpe!=null?dec(t.rpe,1):'—','RPE medio serie'):''}${stat(st.rpePost??'—','RPE post')}${stat(l??'—','sRPE (UA)')}</div>
  ${st.rpePre!=null?`<span class="hint">RPE pre: ${st.rpePre} (${RPE_PRE[st.rpePre]||'—'})</span>`:''}
  ${(()=>{const mv=muscleVolume([st]),c=MG.filter(([g])=>mv.groups[g].sets>0).map(([g,l])=>`<span class="chipset">${l} ${dec(mv.groups[g].sets,Number.isInteger(mv.groups[g].sets)?0:1)}</span>`);return c.length?`<span class="lbl">Series por grupo</span><div class="chips">${c.join('')}</div>`:''})()}</div>
  ${cardioCard(st)}
  <section class="sec"><h3>Ejercicios</h3>
  ${isClient()?'':`<div class="field"><label for="rmF">Fórmula del 1RM estimado</label><select id="rmF">${Object.entries(RM_FORMULAS).map(([k,v])=>`<option value="${k}"${k===fk?' selected':''}>${esc(v.name)}</option>`).join('')}</select></div>`}`;
  const maxC=Math.max(1,...t.ex.map(e=>e.contacts||0));
  const actsDone=st.exercises.filter(e=>e.act);
  if(actsDone.length)h+=`<div class="card"><span class="lbl">Activación</span><div class="chips">${actsDone.map(e=>`<span class="chipset">${e.done?'✓ ':''}${esc(e.name)}</span>`).join('')}</div></div>`;
  t.ex.forEach((e,i)=>{const src=st.exercises[i];if(src?.act)return;
    if(e.plyo){h+=`<div class="card ex"><div class="sec-h"><b>${esc(e.name||'Sin nombre')}${normTxt(e.variant)?` <span class="muted" style="font-weight:400">· ${esc(e.variant)}</span>`:''}</b><span class="tag str">Pliometría</span></div>
      <div class="zb-r st-bar"><span class="k"></span><div class="zb-t"><div class="zb-f" style="width:${e.contacts/maxC*100}%;background:var(--z4)"></div></div><span class="v">${e.contacts}</span><span class="p">cont.</span></div>
      <div class="chips">${(src?.sets||[]).filter(s=>+s.reps>0).map(s=>`<span class="chipset num">${e.unilateral?s.side+' ':''}${s.reps}${s.int?' '+INTS[s.int]:''}${effTxt(s)}</span>`).join('')}</div>
      <span class="hint num">${exSummary(e)}</span></div>`;return}
    const rm=e.unilateral?'':e.e1rm?`1RM est. ${fmtKg(e.e1rm)} kg <span class="muted">(${e.rmSet.reps}×${fmtKg(e.rmSet.kg)})</span>`:(e.top?'Sin serie de ≤ 10 reps para estimar el 1RM':'');
    const sideRow=k=>{const x=e.sides[k];return `<tr><td><b>${SIDE[k]}</b></td><td class="num">${fmtKg(x.vol)} kg</td><td class="num">${x.reps} reps</td><td class="num">${x.e1rm?'1RM '+fmtKg(x.e1rm)+' kg':'—'}</td></tr>`};
    const uniTbl=e.unilateral?`<table class="ztable uni-t">${sideRow('I')}${sideRow('D')}</table>
      <span class="hint num">Asimetría: ${e.asymVol!=null?dec(e.asymVol,1)+' % en volumen':'—'}${e.asymRM!=null?' · '+dec(e.asymRM,1)+' % en 1RM est.':''}${e.asymVol!=null?` (lado ${e.sides.I.vol>=e.sides.D.vol?'izquierdo':'derecho'} más fuerte)`:''}</span>`:'';
    h+=`<div class="card ex"><div class="sec-h"><b>${esc(e.name||'Sin nombre')}${normTxt(e.variant)?` <span class="muted" style="font-weight:400">· ${esc(e.variant)}</span>`:''}</b><span class="hint num" style="text-align:right">${rm}</span></div>
    <div class="zb-r st-bar"><span class="k"></span><div class="zb-t"><div class="zb-f" style="width:${e.vol/maxV*100}%;background:var(--accent)"></div></div><span class="v">${fmtKg(e.vol)}</span><span class="p">kg</span></div>
    ${uniTbl}
    <div class="chips">${(src?.sets||[]).filter(s=>+s.reps>0).map(s=>`<span class="chipset num">${e.unilateral?s.side+' ':''}${s.reps}×${fmtKg(s.kg)}${effTxt(s)}</span>`).join('')}</div>
    <span class="hint num">${exSummary(e)}</span></div>`});
  if(!t.ex.length)h+=`<div class="empty">Esta sesión no tiene ejercicios.</div>`;
  h+=info(`1RM estimado con ${esc(RM_FORMULAS[fk].name)} a partir de la serie que da el valor más alto, usando solo series de 1 a 10 repeticiones. Las fórmulas suponen series cercanas al fallo: si la serie quedó lejos del fallo (RPE bajo), el 1RM real será mayor. Error habitual del ±10 %.`,'Sobre el 1RM estimado')+`</section>
  ${st.rpePost==null||!(st.durationMin>0)?`<section class="sec need-box" id="needBox"><h3>${st.rpePost==null?'Completa la sesión':'Falta la duración'}</h3><span class="hint">${st.rpePost==null?'Con la duración y el RPE se calcula la carga (sRPE).':`RPE post ${st.rpePost}: indica cuánto duró la sesión para calcular la sRPE.`}</span>
    ${st.durationMin>0?'':`<div class="field"><label for="stDur2">Duración (minutos)</label><input id="stDur2" type="number" inputmode="numeric" min="1" max="300" placeholder="min" value="${S.form.dur??''}" style="max-width:160px"><span class="hint">Tiempo total, descansos incluidos.</span></div>`}
    ${st.rpePost==null?rpeScale('rpePost','post',S.form.rpePost??null):''}<button class="btn primary wide" data-act="stSavePending">Guardar</button></section>`:''}
  <div class="card"><div class="field"><label for="stNotes2">Notas</label><textarea id="stNotes2">${esc(st.notes)}</textarea></div></div>
  <div class="row">${athleteBtn('st',st.id,st)}<button class="btn" data-act="stEdit">Editar sesión</button><button class="btn" data-act="stExport">Exportar CSV</button><button class="btn danger" data-act="stDel">Borrar sesión</button></div>`;
  return h;
};
// Edición en vivo de ejercicios y series (sin redibujar la pantalla mientras se escribe)
$('#app').addEventListener('input',e=>{
  if(e.target.id==='stDur2'){S.form.dur=e.target.value;return}
  if(S.view!=='strength'&&S.view!=='stpost')return;const st=stById(S.arg);if(!st)return;const el=e.target;
  if(el.dataset.sf){const f=el.dataset.sf;
    if(f==='startTime'){const t=new Date(el.value).getTime();if(!isNaN(t))st.startTime=t}else st[f]=el.value;
    saveStSoon(st);return}
  if(el.dataset.ex==null)return;const ex=st.exercises[+el.dataset.ex];if(!ex)return;
  if(el.dataset.f==='unilateral'||el.dataset.f==='plyo')return; // se gestiona en 'change'
  if(el.dataset.f==='name'||el.dataset.f==='variant')ex[el.dataset.f]=el.value;
  else{const s=ex.sets[+el.dataset.set];const v=el.value;s[el.dataset.f]=v===''?null:+v;
    // Anotar el RPE de una serie = serie terminada: empieza el descanso (en unilaterales, al anotar el lado derecho)
    if((el.dataset.f==='rpe'||el.dataset.f==='rir')&&v!==''&&st.status==='open'&&s.side!=='I')startRest()}
  const k=strengthStats({exercises:[ex]}).ex[0],x=$('#exs'+el.dataset.ex);if(x)x.textContent=exSummary(k);
  const tt=$('#stTot');if(tt)tt.innerHTML=stTotHTML(strengthStats(st));
  saveStSoon(st);
});
$('#app').addEventListener('change',e=>{
  if(S.view==='strength'&&e.target.dataset.f==='unilateral'){const st=stById(S.arg),ex=st.exercises[+e.target.dataset.ex];
    if(e.target.checked){ex.unilateral=true;ex.sets=ex.sets.flatMap(x=>[{...x,side:'I'},{...x,side:'D'}])}
    else{ex.unilateral=false;ex.sets=ex.sets.filter(x=>x.side!=='D').map(({side,...x})=>x)}
    if(!ex.sets.length)ex.sets=ex.unilateral?[{side:'I',reps:null,kg:null,rpe:null},{side:'D',reps:null,kg:null,rpe:null}]:[{reps:null,kg:null,rpe:null}];
    saveSt(st).then(()=>{const y=scrollY;render();scrollTo(0,y)});return}
  if(S.view==='strength'&&e.target.dataset.f==='plyo'){const st=stById(S.arg),ex=st.exercises[+e.target.dataset.ex];ex.plyo=e.target.checked;ex.plyoAuto=false;saveSt(st).then(()=>{const y=scrollY;render();scrollTo(0,y)});return}
  if(S.view==='strength'&&(e.target.dataset.f==='name'||e.target.dataset.f==='variant')){const st=stById(S.arg),ex=st.exercises[+e.target.dataset.ex];
    if(ex&&e.target.dataset.f==='name'&&(ex.plyo==null||ex.plyoAuto)){ex.plyo=isPlyoName(ex.name);ex.plyoAuto=true}DB.put('strength',st).then(rerenderKeepFocus)}
  if(e.target.id==='rmF'){lsSet('rmFormula',e.target.value);const y=scrollY;render();scrollTo(0,y)}
  if(e.target.id==='stNotes2'){const st=stById(S.arg);st.notes=e.target.value;saveSt(st);toast('Notas guardadas')}});
setInterval(()=>{const c=$('#stClock');const st=S.view==='strength'&&stById(S.arg);if(c&&st)c.textContent=fmtDur(Date.now()-st.startTime)},1000);

// El modo se guarda en el navegador. 'client' = deportista (un único perfil propio), 'coach' = entrenador (todos los perfiles)
const isClient=()=>lsGet('mode')==='client'||S.modeFallback==='client';
// Mi perfil: el marcado como «yo» (meId). En un móvil de entrenador (coachDev) no se deduce: hay que elegirlo
const meId=()=>{const m=prof(lsGet('meId'));return m&&!m.example?m.id:null};
const coachDev=()=>lsGet('coachDev')==='1';
const myProfile=()=>{const m=meId();if(m)return prof(m);if(coachDev())return null;return S.profiles.filter(p=>!p.example&&!p.remote).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))[0]};
// Entrenador que también entrena: en modo deportista no hace falta enviarse datos a sí mismo

function newSinceSent(p){const t=+lsGet('lastSent_'+p.id)||0;

function shareCard(p){
  if(isClient()&&!p.remote&&p.cloudToken){const err=lsGet('syncError')==='token';
    return `<div class="card share"><div class="sec-h"><span class="lbl">Tu entrenador</span></div>
      <span class="hint">${err?'<b class="warnTxt">La sincronización está parada: tu invitación ya no vale.</b> Pide a tu entrenador una invitación nueva.':`Tus entrenos se envían solos a tu entrenador · ${Sync.status()}.`}</span>
      <button class="btn primary" data-act="syncNow">${ic('send')}Sincronizar ahora</button><button class="link" data-act="sendFull">Enviar copia completa (archivo)</button><button class="link" data-act="syncLeave">Dejar de sincronizar</button></div>`}
  if(isClient()&&!p.remote){const t=+lsGet('lastSent_'+p.id)||0,n=newSinceSent(p);
    return `<div class="card share"><div class="sec-h"><span class="lbl">Tu entrenador</span>${n?`<span class="tag pend">${n} sin enviar</span>`:''}</div>
      <span class="hint">${t?`Último envío ${ago(t)}.`:'Todavía no has enviado tus datos.'} Se envía un enlace por WhatsApp con lo nuevo; tu entrenador solo tiene que tocarlo.</span>
      <button class="btn primary" data-act="send">${ic('send')}Enviar a mi entrenador</button><button class="link" data-act="sendFull">Enviar copia completa (archivo)</button></div>`}
  if(isClient()||p.example)return'';
  const me=p.id===meId(),coach=!!lsGet('coachToken');
  if(Sync.linked(p))return `<div class="note info"><b>${me?'Tu perfil se sincroniza':'Se sincroniza solo'}</b><span class="hint">Hoja de Google: ${Sync.status()}.${me?'':' Lo que registre en su móvil te llega solo, y lo que le añadas aquí le llega a él.'}</span>
    ${coach?`<span class="hint">Código en la hoja: <b class="num">${esc(p.cloudId)}</b> <button class="link" data-act="copyCloudId" data-id="${p.id}">Copiar</button> · ponle un apodo en la pestaña «deportistas» para programarle desde la hoja.</span>`:''}
    <div class="row">${me?'':`<button class="btn small" data-act="syncResend" data-id="${p.id}">${ic('send','sm')}Reenviar invitación</button>`}<button class="btn small" data-act="syncRevoke" data-id="${p.id}">Desvincular</button></div></div>`;

/* ===== Envío por enlace: los datos van comprimidos dentro del propio enlace (tras #, nunca llegan a ningún servidor) ===== */
const LINK_MAX=60000; // WhatsApp admite mensajes de hasta unos 65 000 caracteres
const b64u=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64u=str=>{const s=atob(str.replace(/-/g,'+').replace(/_/g,'/'));const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
async function packData(obj){const cs=new CompressionStream('deflate-raw');const buf=await new Response(new Blob([JSON.stringify(obj)]).stream().pipeThrough(cs)).arrayBuffer();return '1'+b64u(new Uint8Array(buf))}
async function unpackData(str){if(str[0]!=='1')throw new Error('versión');const ds=new DecompressionStream('deflate-raw');return JSON.parse(await new Response(new Blob([unb64u(str.slice(1))]).stream().pipeThrough(ds)).text())}
const appUrl=()=>location.origin+location.pathname;
// Curva de FC compacta para enlaces: un punto cada 5 s, tiempos relativos (las cifras de la sesión ya vienen calculadas)
function compactTrack(tr){if(!tr?.samples?.length)return {id:tr?.id,c:1,t0:0,dt:[],b:[],p:tr?.pauses||[]};const out={id:tr.id,c:1,t0:tr.samples[0][0],dt:[],b:[],p:tr.pauses||[]},sg=[];let last=-1e9,lt=tr.samples[0][0],ls=null,any=false;
  for(const [t,b,g] of tr.samples){if(t-last<5000&&g===ls)continue;out.dt.push(Math.round((t-lt)/1000));out.b.push(b);sg.push(g||0);if(g)any=true;last=t;lt=t;ls=g}
  if(any)out.sg=sg;return out}
function expandTrack(tr){if(!tr?.c)return tr;let t=tr.t0;return {id:tr.id,samples:tr.dt.map((d,i)=>{t+=d*1000;return [t,tr.b[i],tr.sg?tr.sg[i]:0]}),rr:[],pauses:tr.p||[]}}
// Comparte por enlace si cabe en un mensaje; si no, como archivo (como antes)
async function shareSmart(data,base,title,linkText,fileText){let link=null;
  try{if('CompressionStream' in window){const d={...data};if(d.tracks)d.tracks=d.tracks.map(compactTrack);link=appUrl()+'#d='+await packData(d)}}catch(e){link=null}
  if(link&&link.length<=LINK_MAX){const msg=`${linkText}\n${link}`;
    try{if(navigator.share){await navigator.share({text:msg});return 'shared'}}catch(e){if(e.name==='AbortError')return 'cancel'}
    try{await navigator.clipboard.writeText(msg);return 'copied'}catch(e){}}
  return await shareFile(data,base,title,fileText)}
const sentMsg=(r,who)=>r==='shared'?`Enviado${who?' a '+who:''}`:r==='copied'?'Enlace copiado: pégalo en WhatsApp':'Archivo guardado en Descargas: envíalo por WhatsApp';
async function shareFile(data,base,title,text){const txt=JSON.stringify(data);
  try{if(navigator.canShare){for(const [ext,type] of [['json','application/json'],['txt','text/plain']]){const f=new File([txt],`${base}.${ext}`,{type});
      if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title,text});return 'shared'}}}}
  catch(e){if(e.name==='AbortError')return 'cancel'}
  await download(`${base}.json`,txt,'application/json',false);return 'downloaded'}

function vamCalc(t){const v=t.vam||{},P=VAM_PROTOS[v.proto]||VAM_PROTOS.vameval,a=age(prof(t.userId)?.birthDate);
