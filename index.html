  let h=`<div class="card"><span class="lbl">${esc(TEST_TYPES[t.type].name)} · ${esc(p?.name||'')}${a!=null?' · '+a+' años':''}</span>
    <div class="g2"><div class="field"><label for="tDate">Fecha</label><input id="tDate" type="datetime-local" data-t="date" value="${toLocalInput(t.date)}"></div>
    <div class="field"><label for="tW">Peso (kg)</label><input id="tW" type="number" inputmode="decimal" step="0.1" data-t="weight" value="${t.weight??''}" placeholder="kg"></div></div>
    ${cyc?`<div class="field"><label for="tHrMax">FC máxima para el cálculo</label><input id="tHrMax" type="number" inputmode="numeric" data-t="hrMax" value="${t.hrMax??''}"><span class="hint">${p?.hrMaxEstimated?'Tomada del perfil, donde está estimada con Tanaka. Si tienes la FCmáx medida, escríbela aquí: el resultado depende mucho de este valor.':'Tomada del perfil.'}</span></div>`:''}</div>`;
  if(dev)h+=`<div class="card" id="tDev"></div>`;
  if(t.type==='vam')h+=vamForm(t);else if(t.type==='vo2')h+=vo2Form(t);else if(t.type==='vt2')h+=vt2Form(t);else h+=jumpForm(t);
  h+=`<section class="sec"><h3>Resultados</h3><div class="card" id="tRes" aria-live="polite"></div></section>
  <div class="card"><div class="field"><label for="tNotes">Notas</label><textarea id="tNotes" data-t="notes" placeholder="${cyc?'Ergómetro, cadencia, condiciones, sensaciones…':t.type==='vam'?'Pista o terreno, viento, calzado, sensaciones…':'Superficie, calzado, calentamiento, sensaciones…'}">${esc(t.notes||'')}</textarea></div></div>
  <div class="row"><button class="btn primary" data-act="tSave">Guardar y volver</button>${athleteBtn('test',t.id,t)}<button class="btn danger" data-act="tDel">Borrar test</button></div>`;
  return h;
};
function stageRows(t,first){return (t.stages||[]).map((s,i)=>`<div class="set"><span class="set-n">${first==='min'?i+1+'′':i+1}</span>
  <input type="number" inputmode="numeric" min="0" data-row="${i}" data-k="w" value="${s.w??''}" aria-label="Potencia etapa ${i+1} (W)">
  <input type="number" inputmode="numeric" min="0" data-row="${i}" data-k="hr" value="${s.hr??''}" aria-label="FC etapa ${i+1}">
  <select data-row="${i}" data-k="rpe" aria-label="RPE etapa ${i+1}">${borgOpts(s.rpe)}</select>
  <button class="icon-btn" data-act="tDelRow" data-i="${i}" aria-label="Borrar etapa ${i+1}">×</button></div>`).join('')}
function vo2Form(t){const h85=t.hrMax?Math.round(t.hrMax*0.85):null;
  return `<div class="card"><span class="lbl">Protocolo</span><div class="seg two" role="radiogroup">
    <button type="button" role="radio" aria-checked="${t.protocol==='ymca'}" class="${t.protocol==='ymca'?'on':''}" data-act="tProto" data-v="ymca">YMCA</button>
    <button type="button" role="radio" aria-checked="${t.protocol!=='ymca'}" class="${t.protocol!=='ymca'?'on':''}" data-act="tProto" data-v="free">Libre</button></div>
    ${info(t.protocol==='ymca'?`Cadencia de 50 rpm y etapas de 3 min. 1.ª etapa a 25 W. La 2.ª depende de la FC al final de la 1.ª: &lt; 80 → 125 W · 80–89 → 100 W · 90–100 → 75 W · &gt; 100 → 50 W. Después, +25 W por etapa. Anota la FC de los minutos 2 y 3; si difieren más de 6 ppm, alarga la etapa un minuto. Termina cuando dos etapas seguidas queden entre 110 y ${h85??'el 85 % de la FCmáx'} ppm (85 % de la FCmáx).`:'Etapas de 2–3 min a cargas crecientes y cadencia constante. Anota la FC estable del final de cada etapa y el RPE. Para antes de superar el 85 % de la FCmáx.','Cómo hacer el test')}</div>
  <section class="sec"><h3>Etapas</h3><div class="card"><div class="sets stg"><div class="set-h"><span>Etapa</span><span>W</span><span>FC</span><span>RPE</span><span></span></div>${stageRows(t)}</div>
    <div class="ex-f"><button class="btn small" data-act="tAddRow">+ Etapa</button><span class="hint num" id="tNext"></span></div>
    ${info(BORG_HINT,'Escala de RPE (Borg 6–20)')}</div></section>`}
function vt2Form(t){const g=t.gen||{start:50,inc:25,n:10};
  return `<div class="card"><span class="lbl">Protocolo</span>${info('Incremental en cicloergómetro a cadencia constante (70–90 rpm): 5 min de calentamiento, empezar a 50–100 W y subir 20–25 W por minuto hasta el agotamiento. Anota la FC al final de cada minuto y, si puedes, el RPE. Hacen falta al menos 5 etapas; cuantas más por encima del umbral, mejor.','Cómo hacer el test')}
    <div class="g3"><div class="field"><label for="gS">Inicio (W)</label><input id="gS" type="number" inputmode="numeric" data-g="start" value="${g.start}"></div>
    <div class="field"><label for="gI">+W/etapa</label><input id="gI" type="number" inputmode="numeric" data-g="inc" value="${g.inc}"></div>
    <div class="field"><label for="gN">Etapas</label><input id="gN" type="number" inputmode="numeric" data-g="n" value="${g.n}"></div></div>
    <button class="btn small" data-act="tGen">Crear etapas con estas cargas</button></div>
  <section class="sec"><h3>Etapas</h3><div class="card"><div class="sets stg"><div class="set-h"><span>Min</span><span>W</span><span>FC</span><span>RPE</span><span></span></div>${stageRows(t,'min')}</div>
    <div class="ex-f"><button class="btn small" data-act="tAddRow">+ Etapa</button></div>${info(BORG_HINT,'Escala de RPE (Borg 6–20)')}</div></section>
  <div class="card"><span class="lbl">VT2 medido (opcional)</span><span class="hint">Si el test se hizo con analizador de gases (VE/VCO2, PetCO2), escribe aquí el VT2 y se usará en lugar de la estimación por FC.</span>
    <div class="g2"><div class="field"><label for="mW">Potencia (W)</label><input id="mW" type="number" inputmode="numeric" data-m="w" value="${t.measured?.w??''}"></div>
    <div class="field"><label for="mH">FC (ppm)</label><input id="mH" type="number" inputmode="numeric" data-m="hr" value="${t.measured?.hr??''}"></div></div></div>`}
function jumpForm(t){
  return Object.entries(JUMPS).map(([k,v])=>`<div class="card"><div class="sec-h"><b>${v.n}</b><span class="hint">${v.d}</span></div>
    <div class="att">${(t.jumps[k]||[]).map((x,i)=>`<div class="field"><label for="j${k}${i}">Intento ${i+1}</label><input id="j${k}${i}" type="number" inputmode="decimal" step="0.1" min="0" data-jk="${k}" data-a="${i}" value="${x??''}" placeholder="cm"></div>`).join('')}</div>
    <button class="btn small" data-act="tAddAtt" data-v="${k}">+ Intento</button></div>`).join('')+
  `<span class="hint">Copia de My Jump Lab la altura en cm de cada intento. Se usa el mejor intento para la potencia y los índices; la media y el CV sirven para ver la consistencia.</span>`}
function testResultsHTML(t){
  if(t.type==='vam')return vamResultsHTML(t);
  if(t.type==='vo2'){const r=vo2Calc(t);let h='';
    if(r.hr)h+=`<div class="stats">${stat(dec(r.hr.vo2,1),'VO2máx ml/kg/min')}${stat(dec(r.hr.abs,2),'VO2máx L/min')}${stat(Math.round(r.hr.wMax),'W a FCmáx')}</div>
      <span class="hint num">Recta FC–potencia con ${r.used} etapa${r.used>1?'s':''} (r² = ${dec(r.hr.lr.r2,3)}), extrapolada a ${t.hrMax} ppm. VO2 con la ecuación ACSM de cicloergómetro: 1,8 × (W × 6,12) / kg + 7.</span>`;
    else h+=`<p class="hint" style="margin:0">${!(t.weight>0)?'Falta el peso. ':''}${!(t.hrMax>0)?'Falta la FC máxima. ':''}${r.flat?'La FC no sube con la carga: revisa los datos. ':''}Introduce al menos 2 etapas con potencia y FC para estimar el VO2máx.</p>`;
    if(r.rpe)h+=`<div class="stats">${stat(dec(r.rpe.vo2_19,1),'Por RPE a 19')}${stat(dec(r.rpe.vo2_20,1),'Por RPE a 20')}${stat(dec(r.rpe.lr.r2,2),'r² RPE')}</div><span class="hint">Estimación alternativa: recta RPE–potencia extrapolada a RPE 19 y 20 (Borg 6–20) y pasada a VO2 con la misma ecuación.</span>`;
    const w=[];if(r.low)w.push('Menos de 2 etapas con FC ≥ 110 ppm: se han usado todas, la estimación será menos fiable.');
    if(r.over85)w.push(`Alguna etapa supera el 85 % de la FCmáx (${Math.round(t.hrMax*0.85)} ppm).`);
    if(w.length)h+=`<div class="note">${w.map(x=>`<span class="hint">${x}</span>`).join('')}</div>`;
    h+=`<div class="chart"><canvas id="tChart" style="height:210px" role="img" aria-label="FC frente a potencia con la recta extrapolada a la FC máxima"></canvas></div>
      <span class="hint">Orientativo: los métodos submáximos dependen de que la FCmáx usada sea la real y suelen tener errores del 10–20 %.</span>`;
    return h}
  if(t.type==='vt2'){const r=vt2Calc(t),v=r.vt2;let h='';
    if(v)h+=`<span class="acwr-pill" style="background:${v.how==='medido'?zc(2):zc(4)}">${v.how==='medido'?'VT2 medido':'VT2 estimado por deflexión de la FC (Dmax)'}</span>
      <div class="stats">${stat(Math.round(v.w),'W en VT2')}${stat(v.hr?Math.round(v.hr):'—','FC en VT2')}${stat(v.pctHrMax!=null?Math.round(v.pctHrMax)+' %':'—','% FCmáx')}${stat(v.pctWpeak!=null?Math.round(v.pctWpeak)+' %':'—','% W pico')}${stat(v.rpe!=null?dec(v.rpe,0):'—','RPE en VT2')}${stat(r.wPeak??'—','W pico')}</div>`;
    else if(r.n<5)h+=`<p class="hint" style="margin:0">Hacen falta al menos 5 etapas con potencia y FC (llevas ${r.n}).</p>`;
    else h+=`<div class="note"><b>No se detecta deflexión de la FC</b><span class="hint">Pasa en una parte de las personas, sobre todo si el test termina pronto o la FC sube de forma lineal hasta el final. Usa el VT2 medido si lo tienes, o repite el test con más etapas por encima del umbral.</span></div>`;
    if(r.n>=2)h+=`<div class="chart"><canvas id="tChart" style="height:210px" role="img" aria-label="FC frente a potencia con el ajuste cúbico y el punto de deflexión"></canvas></div>`;
    h+=`<span class="hint">El método Dmax busca el punto de la curva FC–potencia (ajuste cúbico) más alejado de la recta entre la primera y la última etapa. Es una estimación de campo; el VT2 con analizador de gases es la referencia.</span>`;
    return h}
  const j=jumpCalc(t),row=k=>{const x=j[k];return `<tr><td><b>${JUMPS[k].n}</b></td><td class="num">${x?dec(x.best,1):'—'}</td><td class="num">${x?dec(x.mean,1):'—'}</td><td class="num">${x?.cv!=null?dec(x.cv,1):'—'}</td><td class="num">${x?.pp!=null?Math.round(x.pp):'—'}</td><td class="num">${x?.ppkg!=null?dec(x.ppkg,1):'—'}</td></tr>`};
  const prev=testsOf(t.userId).filter(x=>x.type==='jump'&&x.id!==t.id&&x.date<t.date)[0],pj=prev?jumpCalc(prev):null;
  return `<div class="tbl"><table class="ztable jt"><thead><tr><th></th><th>Mejor cm</th><th>Media</th><th>CV %</th><th>Pot. W</th><th>W/kg</th></tr></thead><tbody>${row('cmj')}${row('sj')}${row('abk')}</tbody></table></div>
    <div class="stats">${stat(j.elastic!=null?dec(j.elastic,1):'—','Elasticidad %')}${stat(j.arms!=null?dec(j.arms,1):'—','Brazos %')}${stat(pj?.cmj&&j.cmj?(j.cmj.best-pj.cmj.best>=0?'+':'')+dec(j.cmj.best-pj.cmj.best,1):'—','Δ CMJ cm')}</div>
    <span class="hint">Potencia pico con Sayers et al. (1999): 60,7 × altura (cm) + 45,3 × masa (kg) − 2055, para CMJ y SJ${t.weight>0?'':' (falta el peso)'}. Índice de elasticidad = (CMJ − SJ) / SJ. Índice de brazos = (Abalakov − CMJ) / CMJ.${pj?` Δ frente al test del ${fmtDate(prev.date)}.`:''}</span>`;
}
function drawXY(el,o){
  if(!el)return;const {c,w,h}=cv(el);const L=38,R=10,T=10,B=26,pw=w-L-R,ph=h-T-B;
  const X=x=>L+(x-o.x0)/(o.x1-o.x0)*pw,Y=y=>T+(1-(y-o.y0)/(o.y1-o.y0))*ph;
  const muted=css('--muted'),line=css('--line'),ink=css('--ink'),acc=css('--accent');
  c.font='10px '+css('--mono');c.fillStyle=muted;c.strokeStyle=line;c.lineWidth=1;
  const tick=(a,b,n)=>{const st=[5,10,20,25,50,100].find(s=>(b-a)/s<=n)||200;const out=[];for(let v=Math.ceil(a/st)*st;v<=b;v+=st)out.push(v);return out};
  c.textAlign='right';c.textBaseline='middle';for(const v of tick(o.y0,o.y1,5)){const y=Math.round(Y(v))+.5;c.beginPath();c.moveTo(L,y);c.lineTo(L+pw,y);c.stroke();c.fillText(v,L-5,y)}
  c.textAlign='center';c.textBaseline='top';for(const v of tick(o.x0,o.x1,6))c.fillText(v,X(v),h-B+5);
  c.fillText(o.xLabel||'W',L+pw-8,h-12);
  c.save();c.beginPath();c.rect(L,T,pw,ph);c.clip();
  if(o.hline){c.strokeStyle=zc(5);c.setLineDash([5,4]);c.beginPath();c.moveTo(L,Y(o.hline.y));c.lineTo(L+pw,Y(o.hline.y));c.stroke();c.setLineDash([]);
    c.fillStyle=zc(5);c.textAlign='left';c.textBaseline='bottom';c.fillText(o.hline.label,L+4,Y(o.hline.y)-2)}
  for(const ln of o.lines||[]){c.strokeStyle=ln.color||ink;c.lineWidth=ln.width||2;c.setLineDash(ln.dash||[]);c.beginPath();ln.pts.forEach(([x,y],i)=>i?c.lineTo(X(x),Y(y)):c.moveTo(X(x),Y(y)));c.stroke()}
  c.setLineDash([]);
  for(const [x,y] of o.points||[]){c.fillStyle=acc;c.beginPath();c.arc(X(x),Y(y),4.5,0,7);c.fill();c.strokeStyle=css('--surface');c.lineWidth=1.5;c.stroke()}
  c.restore();
  if(o.marker){const {x,y,label}=o.marker;c.fillStyle=zc(4);c.beginPath();c.arc(X(x),Y(y),6,0,7);c.fill();c.strokeStyle=css('--surface');c.lineWidth=2;c.stroke();
    c.font='700 13px '+css('--display');const tw=c.measureText(label).width+10,right=X(x)+tw+12<=L+pw;
    const bx=right?X(x)+10:X(x)-10-tw,by=Math.min(T+ph-20,Y(y)+10);
    c.fillStyle=css('--surface');c.strokeStyle=css('--line');c.lineWidth=1;c.beginPath();c.roundRect?c.roundRect(bx,by,tw,20,5):c.rect(bx,by,tw,20);c.fill();c.stroke();
    c.fillStyle=ink;c.textAlign='left';c.textBaseline='middle';c.fillText(label,bx+5,by+10.5)}
}
function drawTestChart(){
  const t=testById(S.arg),el=$('#tChart');if(!t||!el)return;
  const st=(t.stages||[]).filter(s=>+s.w>0&&+s.hr>0).map(s=>[+s.w,+s.hr]);if(!st.length)return;
  const maxW=Math.max(...st.map(p=>p[0])),minHr=Math.min(...st.map(p=>p[1]));
  if(t.type==='vo2'){const r=vo2Calc(t);const wEnd=r.hr?Math.max(r.hr.wMax,maxW):maxW;
    drawXY(el,{x0:0,x1:Math.ceil(wEnd*1.08/25)*25||100,y0:Math.max(40,Math.floor((minHr-15)/10)*10),y1:Math.max(t.hrMax||0,...st.map(p=>p[1]))+10,points:st,
      lines:r.hr?[{pts:[[Math.min(...st.map(p=>p[0])),r.hr.lr.a+r.hr.lr.b*Math.min(...st.map(p=>p[0]))],[r.hr.wMax,t.hrMax]],color:css('--ink'),dash:[6,4],width:1.6}]:[],
      hline:t.hrMax?{y:t.hrMax,label:'FCmáx '+t.hrMax}:null,marker:r.hr?{x:r.hr.wMax,y:t.hrMax,label:Math.round(r.hr.wMax)+' W'}:null})}
  else{const r=vt2Calc(t),d=r.dmax,lines=[];
    if(d){const curve=[];for(let i=0;i<=60;i++){const w=d.x0+(d.x1-d.x0)*i/60;curve.push([w,polyval(d.co,w/d.S0)])}
      lines.push({pts:curve,color:css('--ink'),width:1.8},{pts:[[d.x0,d.y0],[d.x1,d.y1]],color:css('--muted'),dash:[4,4],width:1.2})}
    const v=r.vt2;
    drawXY(el,{x0:Math.max(0,Math.floor((Math.min(...st.map(p=>p[0]))-25)/25)*25),x1:Math.ceil((maxW+15)/25)*25,y0:Math.max(40,Math.floor((minHr-10)/10)*10),y1:Math.max(t.hrMax||0,...st.map(p=>p[1]))+8,
      points:st,lines,hline:t.hrMax?{y:t.hrMax,label:'FCmáx '+t.hrMax}:null,marker:v&&v.hr?{x:v.w,y:v.hr,label:'VT2 '+Math.round(v.w)+' W'}:null})}
}
function updTestResults(){const t=testById(S.arg),box=$('#tRes');if(!t||!box)return;box.innerHTML=testResultsHTML(t);drawTestChart();
  const n=$('#tNext');if(n&&t.type==='vo2'){const nx=t.protocol==='ymca'?ymcaNext(t.stages||[]):null;
    n.textContent=t.protocol==='ymca'?(nx==null?'Anota la FC de la etapa 1 para saber la carga de la 2.ª':`Siguiente etapa: ${nx} W`):''}}
function updTestDevice(){const b=$('#tDev');if(!b)return;const st=BLE.status,on=st==='on'||st==='sim';
  b.innerHTML=on?`<div class="row" style="justify-content:space-between"><span><b>${esc(BLE.name())}</b><br><span class="hint">${testById(S.arg)?.type==='vam'?'La FC más alta se guarda sola mientras esta pantalla está abierta':'Puedes anotar la FC actual en la etapa en curso'}</span></span><span class="num" style="font:700 40px var(--display)"><span id="tHr">${BLE.bpm??'—'}</span> <span class="unit">ppm</span></span></div>
    <div class="row"><button class="btn small primary" data-act="tCurHr">Anotar FC actual</button><button class="btn small" data-act="disconnect">Desconectar</button></div>`
   :(st==='conn'||st==='re')?`<b>${st==='re'?'Reconectando…':'Conectando…'}</b>`
   :`<span class="hint">Conecta el pulsómetro o el reloj para anotar la FC de cada etapa con un toque, o escríbela a mano.</span><div class="row"><button class="btn small" data-act="connect" ${btOK?'':'disabled'}>Conectar pulsómetro</button><button class="btn small" data-act="sim">Usar simulador</button><button class="link" data-act="connectAll" ${btOK?'':'disabled'}>Reloj / todos</button></div>`}
let tSaveT=null;const saveTestSoon=t=>{clearTimeout(tSaveT);tSaveT=setTimeout(()=>DB.put('tests',t),400)};
async function saveTest(t){clearTimeout(tSaveT);await DB.put('tests',t);const i=S.tests.findIndex(x=>x.id===t.id);if(i<0)S.tests.push(t);else S.tests[i]=t}
$('#app').addEventListener('input',e=>{
  if(S.view!=='test')return;const t=testById(S.arg),el=e.target;if(!t)return;const num=v=>v===''?'':+v;
  if(el.dataset.t){const f=el.dataset.t;if(f==='date'){const d=new Date(el.value).getTime();if(!isNaN(d))t.date=d}else if(f==='notes')t.notes=el.value;else t[f]=num(el.value)}
  else if(el.dataset.row!=null){t.stages[+el.dataset.row][el.dataset.k]=num(el.value)}
  else if(el.dataset.jk){t.jumps[el.dataset.jk][+el.dataset.a]=num(el.value)}
  else if(el.dataset.m){t.measured=t.measured||{};t.measured[el.dataset.m]=num(el.value)}
  else if(el.dataset.v&&t.type==='vam'&&el.closest('#app')&&!el.dataset.act){t.vam=t.vam||{proto:'vameval'};t.vam[el.dataset.v]=num(el.value);
    if(el.dataset.v==='stage'){const P=VAM_PROTOS[t.vam.proto]||{},st=+(t.vam.start??P.start),ic2=+(t.vam.inc??P.inc),e2=$('#vStV');if(e2)e2.textContent=+t.vam.stage>0?'= '+dec(st+(+t.vam.stage-1)*ic2,1)+' km/h':''}}
  else if(el.dataset.g){t.gen=t.gen||{start:50,inc:25,n:10};t.gen[el.dataset.g]=num(el.value);saveTestSoon(t);return}
  else return;
  saveTestSoon(t);updTestResults();
});
$('#app').addEventListener('change',e=>{if(e.target.id==='tUser')go('tests',e.target.value,{push:false})});

const TITLES={exlib:()=>'Ejercicios',exedit:()=>S.arg?'Editar ejercicio':'Nuevo ejercicio',home:()=> 'IMDTraining',welcome:()=>'IMDTraining',edit:()=>S.arg?'Editar perfil':isClient()?'Tu perfil':'Nuevo perfil',profile:()=>prof(S.arg)?.name||'Perfil',pre:()=>'Aeróbico',exprog:()=>exerciseRecords(S.arg).find(r=>r.key===S.progKey)?.name||'Progresión',recov:()=>'Recuperación',live:()=>prof(S.rec?.userId)?.name||'Sesión',post:()=>'Después de la sesión',summary:()=>S.sessions.find(x=>x.id===S.arg)?.type||'Sesión',strength:()=>stById(S.arg)?.type||'Fuerza',stpost:()=>'Después de la sesión',ssum:()=>stById(S.arg)?.type||'Fuerza',tests:()=>'Test',plan:()=>planById(S.arg)?.title||'Entrenamiento',test:()=>TEST_TYPES[testById(S.arg)?.type]?.short||'Test'};
function go(view,arg,{push=true,keepForm=false}={}){
  if(S.view==='strength'&&!(view==='strength'&&arg===S.arg))dropDraft(S.arg);
  if(push)S.stack.push([S.view,S.arg]);
  S.view=view;S.arg=arg??null;if(!keepForm)S.form={};render();window.scrollTo(0,0);
  if(push)try{history.pushState({},'')}catch(e){}
}
function back(){
  if(S.view==='live')return; // en directo no se sale con «atrás»
  if(S.view==='strength')dropDraft(S.arg);
  const prev=S.stack.pop();if(!prev){go('home',null,{push:false});return}

// Importación: archivos que envían los clientes o copias de seguridad. Sin filtro de tipo: Android no reconoce bien los .json
async function importFiles(files){
  const res={profiles:[],nNew:0,errors:[],athlete:[],plansDone:0};
  for(const file of files){let d;
    try{let txt=await file.text();txt=txt.replace(/^﻿/,'').trim();
      if(!txt.startsWith('{'))throw new Error('formato');d=JSON.parse(txt)}
    catch(e){res.errors.push(`«${file.name}» no se puede leer como archivo de datos`);continue}
    if(!['imdtraining','imdt-training','pulsometro'].includes(d.app)){res.errors.push(`«${file.name}» no es un archivo de IMDTraining`);continue}
    if(d.tracks)d.tracks=d.tracks.map(expandTrack);
    // Entrenamientos programados y sesiones que envía el entrenador al deportista
    if(d.kind==='plan'||d.kind==='session'){const r=await importForAthlete(d);if(r.error)res.errors.push(r.error);else res.athlete.push(...r.items);continue}
    if(isClient()){res.errors.push(`«${file.name}» son datos para el entrenador: ábrelo en modo entrenador`);continue}
    // Las copias completas traen el perfil de ejemplo del otro móvil: se ignora junto con sus datos
    const exIds=new Set((d.profiles||[]).filter(p=>p.example).map(p=>p.id)),keep=x=>!exIds.has(x.userId)&&!x.example;
    const profiles=(d.profiles||[]).filter(p=>!p.example),sessions=(d.sessions||[]).filter(keep),strength=(d.strength||[]).filter(keep),tests=(d.tests||[]).filter(keep);
    const sesIds=new Set(sessions.map(x=>x.id)),tracks=(d.tracks||[]).filter(t=>sesIds.has(t.id));
    const had=new Set([...S.sessions,...S.strength,...S.tests].map(x=>x.id)),hadP=new Set(S.profiles.map(x=>x.id));
    // Copia completa de un móvil de entrenador: se restaura tal cual (con sus vínculos y la lista de códigos que no se descargan)
    const coachCopy=d.kind==='backup'&&d.role==='coach';
    if(coachCopy&&Array.isArray(d.syncIgnore))for(const c of d.syncIgnore)if(typeof c==='string'&&!S.profiles.some(p=>p.cloudId===c&&!p.example))Sync.ignore(c,true);
    if(coachCopy)for(const x of d.exercises||[])if(x&&x.id&&!(await DB.getRaw('exercises',x.id))?.dirty)await DB.put('exercises',x,{imported:true});
    const fromOther=!coachCopy&&(d.kind==='client'||profiles.some(p=>p.owner==='client'));
    // Si el deportista abrió algo que le enviaste desde un perfil creado por ti, sus datos se guardan en ese mismo perfil
    const idMap={};
    for(const p of profiles){let q={...p};delete q.cloudToken;delete q.synced; // el código de deportista nunca se importa
      if(fromOther){q.remote=true;q.lastImport=Date.now();delete q.owner;delete q.cloudInviteToken;delete q.cloudId;
        // Mismo deportista ya vinculado en este móvil con otro id (por ejemplo, «Deportista 2» llegado por la sincronización)
        const byCloud=p.cloudId&&S.profiles.find(x=>x.cloudId===p.cloudId&&x.id!==p.id);
        if(byCloud){idMap[p.id]=byCloud.id;q={...q,id:byCloud.id}}
        else if(p.linkId&&p.linkId!==p.id&&prof(p.linkId)){idMap[p.id]=p.linkId;q={...q,id:p.linkId,name:prof(p.linkId).name}}}
      // Lo que vincula el perfil en este móvil se conserva, y también su nombre salvo que sea el provisional «Deportista N»
      const loc=prof(q.id);
      if(loc?.cloudId){q.cloudId=loc.cloudId;q.cloudInviteToken=loc.cloudInviteToken||q.cloudInviteToken;if(!/^Deportista \d+$/.test(loc.name))q.name=loc.name}
      if(loc?.cloudToken)q.cloudToken=loc.cloudToken;
      await DB.put('profiles',q);res.profiles.push({name:q.name,id:q.id,isNew:!hadP.has(q.id)})}
    // Cada registro conserva el updatedAt con el que llega: un envío antiguo no pisa una edición más reciente de la hoja
    const rm=x=>idMap[x.userId]?{...x,userId:idMap[x.userId]}:x,imp={imported:true};
    for(const x of sessions)await DB.put('sessions',rm(x),imp);for(const x of tracks)await DB.put('tracks',x,imp);
    for(const x0 of strength){const x=rm(x0),old=stById(x.id);if(old){if(!(x.durationMin>0)&&old.durationMin>0)x.durationMin=old.durationMin;if(x.rpePost==null&&old.rpePost!=null){x.rpePost=old.rpePost;x.rpePostTime=old.rpePostTime}}await DB.put('strength',x,imp)}for(const x of tests)await DB.put('tests',rm(x),imp);
    for(const x of d.plans||[])if(!planById(x.id))await DB.put('plans',rm(x),imp);
    for(const x of d.wellness||[]){const w=rm(x);if(idMap[x.userId]&&w.date)w.id=w.userId+'_'+w.date;await DB.put('wellness',w,imp)}
    // Entrenamientos programados que el deportista ya ha hecho
    for(const x of [...sessions,...strength])if(x.planId&&x.status==='done'){const pl=planById(x.planId)||await DB.get('plans',x.planId);if(pl&&pl.status!=='done'){await markPlanDone(x.planId,x.id,x.endTime||x.startTime);res.plansDone++}}
    res.nNew+=[...sessions,...strength,...tests].filter(x=>!had.has(x.id)).length}
  await loadAll();
  const errs=res.errors.length?'. '+res.errors.join('. '):'';
  if(res.athlete.length&&!res.profiles.length){const a=res.athlete;
    if(a.length===1){const x=a[0];if(x.type==='plan')toRoot('plan',x.id);else if(x.type==='st')toRoot('ssum',x.id);else if(x.type==='hr')toRoot('summary',x.id);else toRoot('test',x.id);
      toast((x.type==='plan'?`Nuevo entrenamiento: ${x.name}`:`Sesión guardada: ${x.name}`)+errs)}
    else{const me=myProfile()||prof(a[0].uid);if(me){S.ptab='res';toRoot('profile',me.id)}toast((a.every(x=>x.type==='plan')?`${a.length} entrenamientos nuevos: `:`Recibidos ${a.length} elementos: `)+a.map(x=>x.name).join(', ')+errs)}
    return}
  const pd=res.plansDone?` · ${res.plansDone} entrenamiento${res.plansDone===1?'':'s'} programado${res.plansDone===1?'':'s'} hecho${res.plansDone===1?'':'s'}`:'';
  if(res.profiles.length===1){const p=res.profiles[0];toRoot('profile',p.id);toast(`${p.isNew?'Añadido':'Actualizado'} el perfil de ${p.name}: ${res.nNew} registro${res.nNew===1?'':'s'} nuevo${res.nNew===1?'':'s'}${pd}${res.errors.length?'. '+res.errors.join('. '):''}`)}
  else if(res.profiles.length){toRoot('home');toast(`Importados ${res.profiles.length} perfiles (${res.profiles.map(p=>p.name).join(', ')}) · ${res.nNew} registros nuevos${res.errors.length?'. '+res.errors.join('. '):''}`)}
  else toast(res.errors.join('. ')||'El archivo no contiene perfiles')}

function genSession(p,start,mins,kind){
  const lim=zoneLimits(p),samples=[],max=p.hrMax;let hr=p.hrRest?p.hrRest+15:80,t=start;
  for(let s=0;s<mins*60;s++){
    let tgt;const m=s/60;
    if(kind==='int'){tgt=m<10?0.65:m>mins-8?0.6:(Math.floor((m-10)/2)%2===0?0.9:0.7)}
    else if(kind==='rec'){tgt=0.6}
    else{tgt=m<8?0.65:m>mins-5?0.62:0.76+0.04*Math.sin(m/4)}
    hr+=(tgt*max-hr)*0.06+(Math.random()-0.5)*2.6;
    samples.push([t,Math.round(hr),0]);t+=1000+(Math.random()<0.02?0:0);
  }
  return {samples,lim};
}
async function seedExample(){

  const p={id:uid(),name:'Ejemplo',birthDate:birth.toISOString().slice(0,10),hrMax:tanaka(22),hrMaxEstimated:true,hrRest:58,weight:72,method:'karvonen',percents:[...DEF_PC],manual:[],createdAt:Date.now(),example:true};
  await DB.put('profiles',p);
  // 6 semanas: 3 sesiones por semana y una última semana más cargada (ACWR al alza)
  const plan=[],types=[['Carrera','cont'],['Intervalos','int'],['Recuperación','rec'],['Carrera','cont']];
  for(let w=5;w>=0;w--){(w===0?[1,2,4,6]:[1,3,5]).forEach((dd,k)=>{const [type,kind]=types[k%4];
    const mins=kind==='rec'?30:38+((w*7+k)%3)*6,post=kind==='int'?(w===0?9:7):kind==='rec'?3:(w===0?7:5);
    plan.push([w*7+dd,type,mins,kind,3+(k%3),post,k%2])})}
  for(const [dAgo,type,mins,kind,pre,post,h] of plan){
    const st=new Date();st.setDate(st.getDate()-dAgo);st.setHours(18+h,15,0,0);const {samples,lim}=genSession(p,st.getTime(),mins,kind);
    const m={id:uid(),userId:p.id,startTime:st.getTime(),endTime:samples.at(-1)[0],activeMs:mins*60000,zoneLimits:lim,hrMax:p.hrMax,rpePre:pre,rpePost:post,rpePostTime:st.getTime()+(mins+30)*60000,type,notes:'',deviceName:'Datos de ejemplo',status:'recording',example:true,...(kind==='rec'?{}:{hrr:(()=>{const e=150+Math.round(Math.random()*20),dr=22+Math.round(Math.random()*12);return {start:e,end:e-dr,drop:dr,at:0}})()})};
    await finalize(m,{id:m.id,samples,rr:[],pauses:[]});
  }
  // Fuerza: una sesión por semana con progresión de cargas
  const R=()=>Math.random();
  for(let w=5;w>=0;w--){const st=new Date();st.setDate(st.getDate()-(w*7+(w===0?3:2)));st.setHours(17,30,0,0);const pr=5-w;
    const sets=(n,reps,kg,rpe0)=>Array.from({length:n},(_,i)=>({reps,kg,rpe:Math.min(10,rpe0+(i>=n-1?1:0)+(w===0?1:0))}));
    const ex=[{name:'Sentadilla',sets:sets(4,6,70+2.5*pr,6)},{name:'Press banca',sets:sets(4,8,50+2.5*Math.floor(pr/2),6)},
      {name:'Peso muerto rumano',sets:sets(3,10,60+2.5*pr,5)},{name:'Dominadas',sets:sets(3,7+Math.floor(pr/3),0,7)}];
    await DB.put('strength',{id:uid(),userId:p.id,kind:'strength',type:w%2?'Tren inferior':'Full body',startTime:st.getTime(),endTime:st.getTime()+55*60000,durationMin:52+Math.round(R()*8),
      rpePre:3,rpePost:w===0?8:7,rpePostTime:st.getTime()+85*60000,notes:'',status:'done',exercises:ex,example:true})}

/* ================= Sincronización (Google Sheets) ================= */
// La app sigue guardando en el móvil y, cuando hay conexión, sube lo pendiente a la hoja de Google del entrenador y baja lo
// que han añadido otros. Gana la edición más reciente (updatedAt). En la hoja no van nombres: cada perfil es su cloudId.
// Especificación: PLAN_SINCRONIZACION_GOOGLE_SHEETS.md (secciones 4 y 5) y apps-script/Code.gs
const SHEET_API='https://script.google.com/macros/s/AKfycbxy4mMRa0K59b-3UHNzsiN0funLIPYL8WCfgPszntlwHfKCZ86p31DR44diLnPTUst_/exec';
const PROFILE_FIELDS=['hrMax','hrMaxEstimated','hrRest','weight','method','percents','manual']; // lo único del perfil que sube
const LOCAL_ONLY=['dirty','updatedAt','deleted','author','serverAt','synced'];
class SyncNetworkError extends Error{}
class SyncTokenError extends Error{}
// Google a veces responde a una petición con un 404 o con una respuesta que no es la suya ({"ok":true} a secas):
// se comprueba la forma de cada respuesta y, si no cuadra, se repite la petición (repetirla no duplica nada)
const SHEET_SHAPE={ping:r=>!!r.role,push:r=>Array.isArray(r.accepted)&&Array.isArray(r.rejected),pull:r=>Array.isArray(r.records)&&typeof r.cursor==='number',
  invite:r=>!!r.token&&!!r.id_unico,rotateCoachToken:r=>!!r.coachToken};
async function sheetCall(payload){let last;
  for(let i=0;i<3;i++){if(i)await new Promise(r=>setTimeout(r,1500*i));
    try{const response=await fetch(SHEET_API,{method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'}, // petición simple: sin preflight CORS
        body:JSON.stringify(payload)});
      if(!response.ok)throw new SyncNetworkError(`HTTP ${response.status}`);
      const res=await response.json(); // {ok:true,…} | {ok:false,error}
      if(res.ok===false||(SHEET_SHAPE[payload.action]||(()=>res.ok===true))(res))return res;
      last=new SyncNetworkError('respuesta incompleta de Google')}
    catch(e){last=e;if(!navigator.onLine)break}}
  throw last}
const pick=(o,ks)=>{const r={};if(o)for(const k of ks)if(k in o)r[k]=o[k];return r};
const omit=(o,ks)=>{const r={...o};for(const k of ks)delete r[k];return r};
const stripSecrets=p=>omit(p,['cloudToken','cloudInviteToken']);
const Sync={running:null,again:false,againFull:false,timer:null,retryMs:0,
  // Rol de este móvil: con código de entrenador sincroniza todos los perfiles vinculados; si no, el perfil con cloudToken
  role(){return lsGet('coachToken')?'coach':S.profiles.some(p=>p.cloudToken)?'athlete':null},
  token(){return this.role()==='coach'?lsGet('coachToken'):S.profiles.find(p=>p.cloudToken)?.cloudToken},
  ignored(){try{return JSON.parse(lsGet('syncIgnore')||'[]')}catch(e){return []}},
  ignore(cid,on){const l=this.ignored().filter(x=>x!==cid);if(on)l.push(cid);lsSet('syncIgnore',JSON.stringify(l))},
  linked(p){if(!p||p.example||!p.cloudId)return false;const r=this.role();return r==='coach'?!this.ignored().includes(p.cloudId):r==='athlete'&&!!p.cloudToken},
  status(){const t=+lsGet('lastSyncAt')||0;return t?'sincronizado '+ago(t):'todavía sin sincronizar'},
  schedule(ms=5000){if(!this.role()||lsGet('syncError')==='token')return;if(S.rec)ms=Math.max(ms,60000); // grabando: después
    clearTimeout(this.timer);this.timer=setTimeout(()=>this.now(),ms)},
  // Un solo sync a la vez; si piden otro mientras tanto, se hace al acabar (y la promesa espera a ese)
  now({full=false}={}){
    if(this.running){this.again=true;if(full)this.againFull=true;return this.running.then(()=>this.running)}
    clearTimeout(this.timer);
    this.running=(async()=>{
      try{if(!this.role())return;
        if(full)lsSet('syncCursor','0');
        await this.pushAll();const changed=await this.pullAll();
        lsSet('lastSyncAt',String(Date.now()));lsSet('syncError','');this.retryMs=0;
        if(changed||S.modalKind==='sync')this.refresh()}
      catch(err){
        if(err instanceof SyncTokenError){lsSet('syncError','token');this.refresh();return}
        console.warn('sync',err); // sin conexión o la hoja ocupada: reintento silencioso, cada vez más espaciado
        this.retryMs=Math.min(this.retryMs?this.retryMs*2:30000,600000);this.schedule(this.retryMs)}
      finally{this.running=null;if(this.again){const f=this.againFull;this.again=this.againFull=false;this.now({full:f})}}})();
    return this.running},
  async call(payload){const res=await sheetCall({...payload,token:this.token()});
    if(!res.ok&&res.error==='token')throw new SyncTokenError('token');
    if(!res.ok)throw new Error(res.error+(res.detail?': '+res.detail:''));
    return res},
  // Mapas perfil local <-> cloudId y sesión -> perfil. localIdOf crea en el entrenador el perfil de un deportista que no tiene
  async ctx(){const raw={};for(const s of SYNC_STORES)raw[s]=await DB.allRaw(s);
    const role=this.role(),ign=this.ignored(),byId=new Map(raw.profiles.filter(p=>!p.deleted).map(p=>[p.id,p])),sess=new Map(raw.sessions.map(s=>[s.id,s]));
    const ctx={raw,role,byId,sess,
      linked:p=>!!p&&!p.example&&!!p.cloudId&&(role==='coach'?!ign.includes(p.cloudId):!!p.cloudToken),
      cloudIdOf:id=>byId.get(id)?.cloudId,
      async localIdOf(cid){const all=[...byId.values()].filter(p=>!p.example);
        if(role==='athlete')return all.find(p=>p.cloudToken&&p.cloudId===cid)?.id||null;
        const p=all.find(p=>p.cloudId===cid);if(p)return p.id;if(ign.includes(cid))return null;
        const n=1+Math.max(0,...all.map(p=>+(/^Deportista (\d+)$/.exec(p.name)||[])[1]||0));
        const q={id:uid(),name:'Deportista '+n,birthDate:'',hrMax:190,hrMaxEstimated:true,hrRest:'',method:'karvonen',percents:[...DEF_PC],manual:[],createdAt:Date.now(),cloudId:cid,remote:true,synced:1};
        await DB.putRaw('profiles',q);byId.set(q.id,q);S.profiles.push(q);return q.id}};
    return ctx},
  // Qué no se sube: datos de ejemplo, perfiles sin vincular, sesiones grabándose y borradores de fuerza vacíos
  shouldPush(s,rec,ctx){if(rec.example)return false;
    if(s==='exercises')return ctx.role==='coach'&&lsGet('srvLib')==='1'; // la batería solo la sube el entrenador, y si la hoja ya la admite
    const sess=s==='tracks'?ctx.sess.get(rec.id):null,uid=s==='profiles'?rec.id:s==='tracks'?sess?.userId:rec.userId;
    if(!ctx.linked(ctx.byId.get(uid)))return false;
    if(!rec.deleted){
      if(s==='sessions'&&rec.status==='recording')return false;
      if(s==='tracks'&&(!sess||sess.deleted||sess.status==='recording'))return false;
      if(s==='strength'&&rec.status==='open'&&stEmpty(rec))return false}
    return true},
  async toCloud(s,rec,ctx){const deleted=!!rec.deleted;
    if(s==='exercises')return {store:s,id:rec.id,userId:LIB_UID,updatedAt:rec.updatedAt,deleted,data:deleted?null:pick(rec,LIB_FIELDS)};
    if(s==='profiles'){const cid=rec.cloudId;return {store:s,id:cid,userId:cid,updatedAt:rec.updatedAt,deleted,data:deleted?null:pick(rec,PROFILE_FIELDS)}}
    if(s==='tracks'){const cid=ctx.cloudIdOf(ctx.sess.get(rec.id).userId); // el track no tiene userId: es el de su sesión
      return {store:s,id:rec.id,userId:cid,updatedAt:rec.updatedAt,deleted,data:deleted?null:await packData({id:rec.id,samples:rec.samples,rr:rec.rr,pauses:rec.pauses})}}
    const cid=ctx.cloudIdOf(rec.userId),id=s==='wellness'?cid+'_'+rec.date:rec.id; // el id de bienestar lleva el id del perfil
    return {store:s,id,userId:cid,updatedAt:rec.updatedAt,deleted,data:deleted?null:{...omit(rec,LOCAL_ONLY),id,userId:cid}}},
  async pushAll(){const ctx=await this.ctx(),batch=[];
    for(const s of SYNC_STORES)for(const rec of ctx.raw[s])if(rec.dirty&&this.shouldPush(s,rec,ctx))
      batch.push({store:s,local:rec.id,updatedAt:rec.updatedAt,deleted:!!rec.deleted,cloud:await this.toCloud(s,rec,ctx)});
    for(let i=0;i<batch.length;){const chunk=[];let size=0; // lotes de 100 registros o ~2 MB
      while(i<batch.length&&chunk.length<100){const n=JSON.stringify(batch[i].cloud).length;if(chunk.length&&size+n>2e6)break;chunk.push(batch[i]);size+=n;i++}
      const res=await this.call({action:'push',records:chunk.map(x=>x.cloud)}),byKey=new Map(chunk.map(x=>[x.store+'|'+x.cloud.id,x]));
      for(const a of res.accepted||[]){const x=byKey.get(a.store+'|'+a.id);if(x)await this.sent(x,true)}
      for(const r of res.rejected||[]){const x=byKey.get(r.store+'|'+r.id);
        if(r.reason==='older'&&r.current)await this.merge(r.current,ctx); // la hoja tiene una versión igual o más reciente: se adopta
        else{console.warn('sync: rechazado',r);if(x)await this.sent(x,false)}}}}, // forbidden/invalid/too_big: no reintentar en bucle
  // Tras subirlo: deja de estar pendiente si no se ha vuelto a editar durante la petición. Un tombstone ya subido se borra del móvil
  async sent(x,ok){const r=await DB.getRaw(x.store,x.local);if(!r||r.updatedAt!==x.updatedAt)return;
    if(ok&&r.deleted){await DB.purge(x.store,x.local);return}
    r.dirty=0;if(ok)r.synced=1;await DB.putRaw(x.store,r)},
  async pullAll(){let changed=0,since=+lsGet('syncCursor')||0,res;
    do{res=await this.call({action:'pull',since,lib:1});if(res.lib)lsSet('srvLib','1');const ctx=await this.ctx();
      for(const c of [...res.records].sort((a,b)=>(a.store!=='profiles')-(b.store!=='profiles')))changed+=await this.merge(c,ctx);
      since=res.cursor;lsSet('syncCursor',String(since))}while(res.more);
    return changed},
  // Fusión: gana el updatedAt mayor; en empate, la hoja. Devuelve 1 si ha cambiado algo en el móvil
  async merge(c,ctx){
    if(c.store==='exercises'){if(ctx.role!=='coach')return 0;const l=await DB.getRaw('exercises',c.id);
      if(!l&&c.deleted)return 0;if(l&&l.dirty&&l.updatedAt>c.updatedAt)return 0;if(l&&!l.dirty&&l.updatedAt===c.updatedAt)return 0;
      const meta={updatedAt:c.updatedAt,author:c.author,dirty:0,synced:1},r=c.deleted?{id:c.id,deleted:true,...meta}:{...pick(c.data||{},LIB_FIELDS),id:c.id,...meta};
      await DB.putRaw('exercises',r);this.applyLocal('exercises',r);return 1}
    if(c.store==='profiles'){if(c.deleted)return 0;const lu=await ctx.localIdOf(c.id),l=lu&&await DB.getRaw('profiles',lu);if(!l)return 0;
      if(l.dirty&&l.updatedAt>c.updatedAt)return 0;if(!l.dirty&&l.updatedAt===c.updatedAt)return 0;
      const m={...l,...pick(c.data||{},PROFILE_FIELDS),updatedAt:c.updatedAt,dirty:0,synced:1}; // nombre, fecha y vínculos: los del móvil
      await DB.putRaw('profiles',m);this.applyLocal('profiles',m);return 1}
    const lu=await ctx.localIdOf(c.userId);if(!lu)return 0;
    const id=c.store==='wellness'?lu+'_'+c.id.slice(c.userId.length+1):c.id,l=await DB.getRaw(c.store,id);
    if(!l&&c.deleted)return 0;
    if(l&&l.dirty&&l.updatedAt>c.updatedAt)return 0; // gana lo del móvil: se subirá
    if(l&&!l.dirty&&l.updatedAt===c.updatedAt){if(!l.synced){l.synced=1;await DB.putRaw(c.store,l)}return 0} // eco de lo que ya tenemos
    const meta={updatedAt:c.updatedAt,author:c.author,dirty:0,synced:1};let r;
    if(c.deleted)r={id,...(c.store==='tracks'?{}:{userId:lu}),deleted:true,...meta};
    else if(c.store==='tracks')r={...await unpackData(c.data),id,...meta};
    else{r={...c.data,id,userId:lu,...meta};delete r.deleted}
    await DB.putRaw(c.store,r);this.applyLocal(c.store,r);return 1},
  // Lleva el cambio a la memoria de la app sin recargarlo todo. Lo que se está editando en pantalla no se toca:
  // al guardar, la edición local es más reciente y gana
  applyLocal(s,r){const arr=S[s];if(!Array.isArray(arr))return;
    if(S.arg===r.id&&((S.view==='strength'&&s==='strength')||(S.view==='plan'&&s==='plans')||(S.view==='test'&&s==='tests')))return;
    const i=arr.findIndex(x=>x.id===r.id);if(r.deleted){if(i>=0)arr.splice(i,1)}else if(i>=0)arr[i]=r;else arr.push(r)},
  refresh(){if(S.modalKind==='sync'){openSyncModal();return}
    if(S.rec||!$('#modal').hidden||['live','recov','edit','pre','post','stpost','strength','plan','test'].includes(S.view))return; // no redibujar mientras se escribe
    rerenderKeepFocus()},
  // Al vincular un perfil: todo lo suyo pasa a pendiente de subir. Los datos antiguos sin updatedAt usan su propia fecha
  // (no la de ahora) para no ganar a una edición real del otro lado. Normaliza el id de bienestar a perfil_fecha
  async markAllDirty(pid){
    const t0=x=>x.updatedAt||[x.rpePostTime,x.endTime,x.startTime,typeof x.date==='number'?x.date:null,x.at,x.createdAt].find(v=>typeof v==='number'&&v>0)||0;
    const mark=async(s,x,t)=>{x.dirty=1;x.updatedAt=t??t0(x);await DB.putRaw(s,x)};
    const p=await DB.getRaw('profiles',pid);if(!p)return;await mark('profiles',p);
    for(const x of (await DB.allRaw('sessions')).filter(x=>x.userId===pid)){await mark('sessions',x);const t=await DB.getRaw('tracks',x.id);if(t)await mark('tracks',t,t.updatedAt||x.updatedAt)}
    for(const s of ['strength','tests','plans'])for(const x of (await DB.allRaw(s)).filter(x=>x.userId===pid))await mark(s,x);
    for(const x of (await DB.allRaw('wellness')).filter(x=>x.userId===pid)){const id=pid+'_'+x.date;if(x.id!==id){await DB.purge('wellness',x.id);x.id=id}await mark('wellness',x)}
    await loadAll()},
  start(){const kick=()=>{if(lsGet('pendingJoin')&&isClient()&&myProfile())joinWith(lsGet('pendingJoin'));else this.schedule(100)};
    kick();addEventListener('online',kick);
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')this.schedule(100)})}
};
// Entrenador: conectar este móvil con la hoja (también desde un enlace #coach=)
async function coachConnect(code){code=String(code||'').trim();if(!code){toast('Pega tu código de entrenador');return}
  let res;try{res=await sheetCall({action:'ping',token:code})}catch(e){toast('No se puede conectar con la hoja. Comprueba que tienes internet');return}
  if(!res.ok){toast(res.error==='token'?'Ese código no vale. Cópialo de tu hoja: pestaña config, celda B2':'La hoja no ha respondido bien. Prueba otra vez en un momento');return}
  if(res.role!=='coach'){toast('Ese código no es de entrenador');return}
  lsSet('coachToken',code);lsSet('syncCursor','0');lsSet('syncError','');lsSet('mode','coach');lsSet('coachDev','1');S.modeFallback=null;
  closeModal();toRoot('home');toast('Conectado. Descargando los datos…');
  const t=Date.now();await Sync.now({full:true});
  const n=S.profiles.filter(p=>Sync.linked(p)).length;
  toast(+lsGet('lastSyncAt')>=t?`Conectado: ${n} deportista${n===1?'':'s'}`:'Conectado. Los datos llegarán cuando haya conexión')}
// Deportista: completar una invitación #join=<token>.<id_unico>
async function joinWith(v,force){const [token,cid]=String(v||'').split('.');
  if(!token||!cid){toast('El enlace de invitación está incompleto. Pide a tu entrenador que te lo reenvíe');return}
  if(!isClient()){toast('Este enlace de invitación es para el móvil del deportista');return}
  const p=myProfile();if(!p){lsSet('pendingJoin',v);clientRoot();render();toast('Crea tu perfil y se conectará con tu entrenador');return}
  let res;try{res=await sheetCall({action:'ping',token})}catch(e){lsSet('pendingJoin',v);toast('Sin conexión: te conectaré con tu entrenador cuando vuelva internet');return}
  if(!res.ok||res.role!=='athlete'||res.id_unico!==cid){lsSet('pendingJoin','');toast('Esta invitación ya no vale. Pide a tu entrenador que te la reenvíe');return}
  if(p.cloudId&&p.cloudId!==cid&&!force){openJoinConfirm(v);return}
  lsSet('pendingJoin','');p.cloudId=cid;p.cloudToken=token;await DB.put('profiles',p);
  lsSet('syncError','');lsSet('syncCursor','0');lsSet('lastSyncAt','');
  await Sync.markAllDirty(p.id);render();toast('Conectando con tu entrenador…');
  const t=Date.now();await Sync.now({full:true});render();
  toast(+lsGet('lastSyncAt')>=t?'Conectado con tu entrenador':'Conectado. Tus entrenos se enviarán cuando haya conexión')}
function openJoinConfirm(v){S.modalKind='join';S.joinV=v;
  $('#modal').innerHTML=`<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="joinTitle"><div class="sec-h"><h2 id="joinTitle">Nueva invitación</h2><button class="icon-btn" data-act="wClose" aria-label="Cerrar">×</button></div>
    <span class="hint">Este móvil ya estaba conectado con tu entrenador. ¿Conectar con la nueva invitación?</span>
    <div class="row"><button class="btn primary" data-act="joinYes">Conectar</button><button class="btn" data-act="wClose">Cancelar</button></div></div>`;
  $('#modal').hidden=false;document.body.classList.add('modal-open')}
// Ventana «Sincronización» del menú
function openSyncModal(){S.modalKind='sync';const coach=!!lsGet('coachToken'),err=lsGet('syncError')==='token',ath=!coach&&S.profiles.find(p=>p.cloudToken);let body;
  if(ath)body=`<span class="hint">${err?'<b class="warnTxt">La sincronización está parada: tu invitación ya no vale.</b> Pide a tu entrenador una invitación nueva.':`Tus entrenos se envían solos a tu entrenador · ${Sync.status()}.`}</span>
    <div class="row"><button class="btn small primary" data-act="syncNow">Sincronizar ahora</button><button class="btn small" data-act="syncLeave">Dejar de sincronizar</button></div>`;
  else if(coach&&!S.syncEdit){const n=S.profiles.filter(p=>Sync.linked(p)).length;
    body=`<span class="hint">${err?'<b class="warnTxt">La sincronización está parada: el código ya no vale.</b> Pega el código nuevo con «Cambiar código».':`Conectado con tu hoja de Google · ${Sync.status()} · ${n} perfil${n===1?'':'es'} vinculado${n===1?'':'s'}.`}</span>
    <div class="row"><button class="btn small primary" data-act="syncNow">Actualizar ahora</button><button class="btn small" data-act="syncChange">Cambiar código</button></div>
    <div class="row"><button class="btn small" data-act="syncRotate">Generar código nuevo</button><button class="btn small danger" data-act="syncOff">Desconectar</button></div>
    ${info('«Generar código nuevo» crea otra llave y la anterior deja de valer en todos tus móviles: úsalo si pierdes el móvil. «Desconectar» deja de sincronizar este móvil; sus datos se quedan aquí y en la hoja.','Qué hace cada botón')}`}
  else body=`<span class="hint">Conecta esta app con tu hoja de Google para ver los datos de tus deportistas sin pedírselos.</span>
    <div class="field"><label for="syncCode">Código de entrenador</label><input id="syncCode" autocomplete="off" spellcheck="false" placeholder="Pégalo aquí"><span class="hint">Está en tu hoja «IMDTraining datos», pestaña config, celda B2.</span></div>
    <button class="btn primary wide" data-act="syncConnect">Conectar</button>${coach?'<button class="btn wide" data-act="syncBack">Cancelar</button>':''}`;
  $('#modal').innerHTML=`<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="syncTitle"><div class="sec-h"><h2 id="syncTitle">Sincronización</h2><button class="icon-btn" data-act="wClose" aria-label="Cerrar">×</button></div>${body}</div>`;
  $('#modal').hidden=false;document.body.classList.add('modal-open')}
function syncAlert(){const r=Sync.role();if(!r||lsGet('syncError')!=='token')return'';
  return `<div class="note"><b>La sincronización está parada</b><span class="hint">${r==='coach'?'El código de entrenador ya no vale. Pega el nuevo: está en tu hoja, pestaña config, celda B2.':'Tu invitación ya no vale. Pide a tu entrenador una invitación nueva.'}</span><div class="row"><button class="btn small" data-act="syncOpen">${r==='coach'?'Cambiar código':'Ver sincronización'}</button></div></div>`}
// Entrenador: invitar, reenviar y desvincular desde la tarjeta del perfil
const syncFail=e=>toast(e instanceof SyncTokenError?'Tu código de entrenador ya no vale: revisa Sincronización en el menú':'No se puede conectar con la hoja. Prueba otra vez con internet');
async function shareInvite(p){const url=appUrl()+'#join='+p.cloudInviteToken+'.'+p.cloudId,text='Te invito a sincronizar tus entrenamientos con IMDTraining. Abre este enlace en Chrome en tu móvil:';
  // En el móvil, menú de compartir (WhatsApp); en el ordenador, directamente al portapapeles
  const mobile=/Android|iPhone|iPad/i.test(navigator.userAgent);
  try{if(navigator.share&&mobile){await navigator.share({title:'IMDTraining',text,url});return}}catch(e){if(e.name==='AbortError')return}
  // En el ordenador solo el enlace: así se puede pegar en la barra de direcciones sin que acabe en una búsqueda
  try{await navigator.clipboard.writeText(mobile?text+' '+url:url);toast('Enlace de invitación copiado: pégalo en WhatsApp')}catch(e){toast(url)}}
async function syncInvite(id){let p=prof(id);if(!p)return;
  let r;try{r=await Sync.call({action:'invite'})}catch(e){syncFail(e);return}
  p.cloudId=r.id_unico;p.cloudInviteToken=r.token;if(p.id!==meId())p.remote=true;await DB.put('profiles',p);
  await Sync.markAllDirty(p.id);Sync.now();p=prof(id);render();
  if(p.id===meId()){toast('Tu perfil ya se sincroniza');return}
  await shareInvite(p)}
async function syncResend(id){const p=prof(id);if(!p?.cloudId)return;
  if(!p.cloudInviteToken){let r;try{r=await Sync.call({action:'invite',id_unico:p.cloudId})}catch(e){syncFail(e);return}p.cloudInviteToken=r.token;await DB.put('profiles',p)}
  await shareInvite(p)}

/* ================= Arranque ================= */
async function loadAll(){S.profiles=await DB.all('profiles');S.sessions=await DB.all('sessions');S.strength=await DB.all('strength');S.tests=await DB.all('tests');S.plans=await DB.all('plans');S.wellness=await DB.all('wellness');S.exercises=await DB.all('exercises')}
(async()=>{
  await DB.open();await loadAll();
  try{navigator.storage?.persist?.()}catch(e){}
  for(const st of S.strength.filter(x=>x.status==='open'&&stEmpty(x)))dropDraft(st.id);
  // Enlace con datos o petición de envío
  const linkCode=location.hash.startsWith('#d=')?location.hash.slice(3):null,askSend=location.hash==='#enviar';
  // Sincronización: invitación de deportista (#join=código.id) o código de entrenador (#coach=código). Se quitan de la barra en seguida
  const joinCode=location.hash.startsWith('#join=')?location.hash.slice(6):null,coachCode=location.hash.startsWith('#coach=')?location.hash.slice(7):null;
  if(linkCode||askSend||joinCode||coachCode)try{history.replaceState({},'',location.pathname+location.search)}catch(e){}
  let linkKind=null;if(linkCode)try{linkKind=(await unpackData(linkCode)).kind}catch(e){}
  // Modo: enlace de invitación (#cliente), elección guardada o deducido de los datos que ya hay
  let m=lsGet('mode');
  if(!m&&(joinCode||coachCode)){m=joinCode?'client':'coach';lsSet('mode',m);if(!lsGet('mode'))S.modeFallback=m}
  if(!m&&linkKind){m=linkKind==='plan'||linkKind==='session'?'client':'coach';lsSet('mode',m);if(!lsGet('mode'))S.modeFallback=m}
  if(!m){const own=S.profiles.filter(p=>!p.example&&!p.remote);
    if(location.hash==='#cliente')m='client';
    else if(own.length===1&&own[0].owner==='client'&&S.profiles.length===1)m='client';
    else if(S.profiles.length||lsGet('seeded'))m='coach';
    if(m){lsSet('mode',m);if(!lsGet('mode'))S.modeFallback=m}}
  if(location.hash==='#cliente')try{history.replaceState({},'',location.pathname+location.search)}catch(e){}
  // Datos de ejemplo (solo modo entrenador): se crean la primera vez y se renuevan si cambia su versión
  const ex=S.profiles.find(p=>p.example);
  if(m==='coach'&&((!S.profiles.length&&!lsGet('seeded'))||(ex&&lsGet('seedv')!=='6'))){
    if(ex){for(const s of S.sessions.filter(s=>s.userId===ex.id)){await DB.purge('sessions',s.id);await DB.purge('tracks',s.id)}
      for(const s of S.strength.filter(s=>s.userId===ex.id))await DB.purge('strength',s.id);for(const t of S.tests.filter(t=>t.userId===ex.id))await DB.purge('tests',t.id);for(const x of S.plans.filter(x=>x.userId===ex.id))await DB.purge('plans',x.id);for(const x of S.wellness.filter(x=>x.userId===ex.id))await DB.purge('wellness',x.id);await DB.purge('profiles',ex.id)}
    await seedExample();lsSet('seedv','6');await loadAll()}
  try{history.replaceState({},'')}catch(e){}
  // Archivos compartidos a la app desde WhatsApp u otra app (llegan por el service worker)
  const sharedN=new URLSearchParams(location.search).get('shared');
  if(m==='coach')lsSet('coachDev','1');
  if(!m)S.view='welcome';else if(m==='client')clientRoot();
  syncDrawerMode();render();updChip();
  if(sharedN!=null){try{history.replaceState({},'',location.pathname)}catch(e){}await importShared()}
  if(linkCode)await importLink(linkCode);
  if(askSend)askSendFocus();
  if(coachCode)await coachConnect(coachCode);
  if(joinCode)await joinWith(joinCode);
  Sync.start();
  // Instalación como app (solo desde su propio enlace https)
  if('serviceWorker' in navigator&&!inFrame&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
